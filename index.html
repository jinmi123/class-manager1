function getWeek() {
    const saved = localStorage.getItem('semester_config');
    if (saved) {
        const cfg = JSON.parse(saved);
        const start = new Date(cfg.startDate);      // 学期第一天
        const total = parseInt(cfg.totalWeeks) || 20;
        const now = new Date();
        const diffDays = Math.floor((now - start) / (24 * 60 * 60 * 1000));
        if (diffDays < 0) return 1;                 // 还没开学，显示第 1 周
        const week = Math.ceil((diffDays + 1) / 7); // 第 1 周从开学第一天开始

    }
    // 未配置时，回退到原来的 ISO 周次计算
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), 0, 1);
    const days = Math.floor((now - firstDay) / (24 * 60 * 60 * 1000));
    return Math.ceil((days + firstDay.getDay() + 1) / 7);
}

function getAgeFromIdcard(idcard) {
    if (!idcard || idcard.length !== 18) return '';
    const birthStr = idcard.substring(6, 14);
    const birthYear = parseInt(birthStr.substring(0, 4));
    const birthMonth = parseInt(birthStr.substring(4, 6)) - 1;
    const birthDay = parseInt(birthStr.substring(6, 8));
    const birthDate = new Date(birthYear, birthMonth, birthDay);
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;

                <div class="page" id="page-rules">
            <div class="card">
                <h2>📜 学生考勤制度</h2>
                <div style="font-size:13px; line-height:1.8; white-space:pre-wrap;">
（一）学生必须遵守学校各项规章制度，按时到校上课，凡因病、因事不能上课者，应和班主任老师请假，否则作旷课处理；上课前擅离教室（或现场）者作早退处理。

（二）每班设立教学日志。每节课（包括自习、劳动、集合等）均应由班主任、任课老师点名登记，学生考勤每周由班主任在班内公布一次，每月由政教处向全校公布一次，学期结束时，须将学生出勤情况记入学生学籍表和学生档案。

（三）学生请病、事假须有家长或医生证明，请假三天以内的由班主任签核实意见后送政教处审批，请假三天以上，征得家长意见后，由校级领导审批，学生因急事或因病来不及请假者，应在回校两天内持证办理补假手续。

（四）有慢性病不能坚持学习的学生，凭医院证明申请休学一年，休学期满后应回校办理复学手续，经医院证明病未愈，不能复学者，可继续休学一年。

（五）一学期累计旷课达到21课时，或请事假累计达到35课时者，给予警告处分；累计旷课达到35课时，或请事假累计达到56课时者，给予严重警告处分；累计旷课达到50课时，或请事假累计达到70课时者，给予记过处分；累计旷课达到80课时，或请事假累计达到90课时者，给予留校察看处分；累计旷课达到90课时，或无故离校连续两周者，作自动退学处理。自动退学的学生，从处分之日起，取消其学籍。

（六）迟到、早退2次当旷课一节，请事假10节当旷课一节。
                </div>
            </div>
            <div class="card">
                <h2>📱 手机使用管理规定（试行）</h2>
                <div style="font-size:13px; line-height:1.8; white-space:pre-wrap;">
中职学生正值集中精力、努力学习的时期，学校一直不提倡学生追求生活的奢侈。学生使用手机在方便联络的同时，也给学生的学习、财物的保管、学校的管理和课堂教学的正常秩序带来很大的负面影响。根据大部分家长的要求并结合我校的实际情况，特制订学生携带手机暨使用管理规定，请全体同学自觉遵守。

第一条 学校绝不提倡学生在校期间使用手机，确实需要使用的要妥善保管好自己的手机，如有丢失由学生个人负责。

第二条 原则上不带手机到校，如需带手机到学校的学生请在指定地点（寝室）和指点时间（晚上9.00-10.30）内使用。（出寝室时请自觉放保管柜，由教官、宿管代管。）禁止学生带手机到教室。

第三条 禁止学生在教学时间（考试、实习、自习、上课等）使用手机。

第四条 禁止学生在集会时间（早操、课间操、校会、升旗仪式等）使用手机。

第五条 禁止学生在走路时使用手机玩游戏、看小说等长时间使用手机。

第六条 学生晚上熄灯22：30分之后，应将手机关机或设为静音状态放回手机柜，严禁使用手机在宿舍区聊天、大声喧哗，影响他人休息。

第七条 学生中午午休13:00分之后，应将手机关机或设为静音状态，严禁使用手机在宿舍区聊天、大声喧哗。

第八条 手机不可带到教室内、实训实验室。

第九条 特殊情况下可以在老师的寝室或办公室给手机充电，但必须经过老师的同意。

第十条 学生违反使用手机管理规定，按下列要求予以处罚：
1. 第一次违规带到教室使用，班主任代管手机一周，班主任对学生单独进行批评教育。
2. 第二次违规带到教室使用，班主任代管手机两周，班主任在班级对学生进行通报批评，并扣德育操行分5—15分。
3. 第三次违规带到教室使用，班主任代管手机一个月，一个月后由其家长领回手机，并予以全校通报批评、警告或严重警告处分。
4. 第四次违规使用，学校代管手机一个学期，学期结束后由其家长领回手机，对违纪学生予以记过、记大过处分。
5. 对拒不交出手机或因收缴而顶撞教师，视情节轻重对违纪学生予以记过、留校察看处分，情节特别严重的依据学校预警制——红色预警（取消学籍，劝其退学）。
6. 学校值班教师、教官将不定期抽查，对于违规使用手机，学校一律代管手机两周。

第十一条 本规定自2023年8月23日起执行！
                </div>
            </div>

async function refreshDashboard() {

    const allActive = students.filter(s => s.status === '在读');
    const zoudu = allActive.filter(s => s.zoudu === '是');
    const zhuxiao = allActive.filter(s => s.zoudu !== '是');

    const zouduCount = zoudu.length;
    const zhuxiaoCount = zhuxiao.length;

    // 缺勤集合
    const absentAM = new Set();
    const absentPM = new Set();
    const absentEVE = new Set();
    const leaveSet = new Set();

    todayLogs.forEach(l => {
    const student = l.student;
    const reason = l.reason || '';

    // 1. 请假（含连续请假合并记录）
    if (l.code === '请假') {
        leaveSet.add(student);
        if (reason.includes('上午')) absentAM.add(student);
        if (reason.includes('下午')) absentPM.add(student);
        if (reason.includes('晚自习')) absentEVE.add(student);
    }
    // 2. 旷课（A1 / A3）—— 修正匹配关键字
    else if (l.code === 'A1' || l.code === 'A3') {
        if (reason.includes('上午')) absentAM.add(student);
        if (reason.includes('下午')) absentPM.add(student);
        if (reason.includes('晚自习')) absentEVE.add(student);
    }
    // 3. 迟到 / 早退 / 旷操 —— 默认影响上午和下午
    else if (l.code === 'A2' || l.code === 'A4') {
        absentAM.add(student);
        absentPM.add(student);
    }
    // 4. 特殊事项（Z1 或 Z3）—— 兼容新旧格式
    else if ((l.code === 'Z1' || l.code === 'Z3') && 
             (reason.startsWith('特殊事项：') || reason.startsWith('走读/特殊事项：'))) {
        const detail = reason.replace('特殊事项：', '').replace('走读/特殊事项：', '');
        if (detail.includes('早上') || detail.includes('上午')) absentAM.add(student);
        if (detail.includes('下午')) absentPM.add(student);
        if (detail.includes('晚上') || detail.includes('晚自习')) absentEVE.add(student);
    }
});

    // 计算实到人数
    const presentAM = total - absentAM.size;
    const presentPM = total - absentPM.size;
    const zhuxiaoEveAbsent = [...absentEVE].filter(s => zhuxiao.some(z => z.name === s)).length;

    document.getElementById('stat-pm').textContent = presentPM + ' / ' + absentPM.size;
    document.getElementById('stat-eve').textContent = presentEVE + '（住校） / ' + absentEVE.size;
    // 更新当前节次卡片

    // AI 公共调用函数
        // 清理 Markdown 标记，去除 AI 味道
    function cleanMarkdown(text) {
        if (!text) return text;
        return text
            .replace(/^#{1,6}\s/gm, '')      // 去除标题 #、## 等
            .replace(/\*{1,2}([^*]+)\*{1,2}/g, '$1') // 去除加粗和斜体
            .replace(/~~([^~]+)~~/g, '$1')   // 去除删除线
            .replace(/`{1,3}[^`]*`{1,3}/g, '') // 去除行内代码
            .replace(/^- /gm, '')            // 去除无序列表短横
            .replace(/^\d+\. /gm, '')        // 去除有序列表数字
            .replace(/\n{2,}/g, '\n\n')      // 减少连续空行
            .trim();
    }

    // AI 公共调用函数（自动清洗结果）
   async function callAI(systemPrompt, userPrompt, maxTokens = 500) {
    try {
        const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + DEEPSEEK_KEY
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                ],
                temperature: 0.1,
                max_tokens: maxTokens
            })
        });
        const data = await res.json();
        return data.choices[0].message.content;
    } catch (e) {
        console.error('AI调用失败:', e);
        return '否';
    }
}

      window.saveWeeklyData = async function() {
    const wk = parseInt(document.getElementById('weekly-week-num').value) || getWeek();
    const entries = [];
    document.querySelectorAll('#weekly-tbody tr').forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (!inputs.length) return;
        const name = inputs[0].dataset.student;
        const d = { week: wk, student: name };
        inputs.forEach(inp => { d[inp.dataset.day] = inp.value; });
        entries.push(d);
    });
    await sb.from('weekly_data').delete().eq('week', wk);
    if (entries.length) await sb.from('weekly_data').insert(entries);

    const today = fmt(new Date());
    const dayNames = { mon:'周一', tue:'周二', wed:'周三', thu:'周四', fri:'周五' };
    const allDeduct = getDeductCodes();
    const allBonus = getBonusCodes();

    for (const e of entries) {
        // 处理周一至周五的每个单元格
        for (const day of ['mon', 'tue', 'wed', 'thu', 'fri']) {
            const val = e[day]?.trim();
            if (!val) continue;
            const parts = val.split(/\s+/);
            const code = parts[0];
            const score = parseFloat(parts[1]);
            if (!code || isNaN(score)) continue;

            const deductItem = allDeduct.find(c => c.code === code);
            const bonusItem = allBonus.find(c => c.code === code);
            const desc = deductItem?.desc || bonusItem?.desc || '';
            const action = score > 0 ? '加分' : '违纪';
            const reasonText = desc
                ? `${dayNames[day]}${action}：${desc}（${code}）`
                : `${dayNames[day]}${action}（${code}）`;

            await sb.from('score_log').insert({
                student: e.student, date: today, week: wk,
                code: code,
                reason: reasonText,
                value: score,
                operator: '班干', basis: '周表'
            });
        }

        // 处理独立的"加分事由"列
        if (e.bonus_score && parseFloat(e.bonus_score) !== 0) {
            const bonusCode = e.bonus_reason?.trim() || 'P2';
            const bonusItem = allBonus.find(c => c.code === bonusCode);
            const bonusDesc = bonusItem ? `${bonusItem.desc}（${bonusCode}）` : `加分（${bonusCode}）`;
            await sb.from('score_log').insert({
                student: e.student, date: today, week: wk,
                code: bonusCode,
                reason: `周加分：${bonusDesc}`,
                value: Math.abs(parseFloat(e.bonus_score)),
                operator: '班干', basis: '周表'
            });
        }
    }
    await loadData(); renderWeeklyTable(); window.renderScoreLog(); refreshDashboard();
    toast('已保存并同步流水');
};

            const lastLog = logs.filter(l => l.student === s.name && l.value < 0).pop();
            // 根据学生手册计算建议处置
            let measure = '';
            if (sc < 50) measure = '劝退';

            if (sc < 80) measure += '；取消优秀毕业生评定';
            if (sc < 70) measure += '；延迟半年发放毕业证';
            autoAlerts.push({
                id: 'auto_' + s.name,
                date: fmt(new Date()),
                student: s.name,
                score: sc,
                level: lv,
                no: '自动预警',
                feedback: lastLog ? `最后违纪：${lastLog.reason || lastLog.code} (${lastLog.date})` : '暂无违纪记录',
                measure: measure
            });
        }
    });
    const allAlerts = [...alerts, ...autoAlerts].sort((a, b) => a.score - b.score);

            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_KEY },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                ],
                temperature: 0.7,
                max_tokens: 600
            })
        });
        const data = await res.json();
        let txt = data.choices[0].message.content;

        // 清洗 Markdown 符号
        txt = txt
            .replace(/#{1,6}\s*/g, '')          // 去除标题
            .replace(/\*\*(.*?)\*\*/g, '$1')    // 去除加粗
            .replace(/___(.*?)___/g, '$1')      // 去除其他加粗
            .replace(/\*(.*?)\*/g, '$1')        // 去除斜体
            .replace(/^\s*[-*+]\s/gm, '')       // 去除无序列表符号
            .replace(/^\d+\.\s/gm, '')          // 去除有序列表数字
            .replace(/`{1,3}[^`]*`{1,3}/g, '') // 去除代码块
            .trim();

        // 尝试匹配标题（兼容多种写法）
        const pointsMatch = txt.match(/【(谈话)?要点】\s*([\s\S]*?)(?=【(学生可能)?表态】|【后续跟进】|$)/);
        const responseMatch = txt.match(/【(学生可能)?表态】\s*([\s\S]*?)(?=【后续跟进】|$)/);
        const followupMatch = txt.match(/【后续跟进】\s*([\s\S]*)/);

        if (pointsMatch || responseMatch || followupMatch) {
            document.getElementById('talk-points').value = pointsMatch ? pointsMatch[2].trim() : '';
            document.getElementById('talk-response').value = responseMatch ? responseMatch[2].trim() : '';
            document.getElementById('talk-followup').value = followupMatch ? followupMatch[1].trim() : '';
        } else {
            // 如果标题匹配失败，按双换行拆分成三部分
            const parts = txt.split(/\n{2,}/);
            if (parts.length >= 3) {
                document.getElementById('talk-points').value = parts[0].trim();
                document.getElementById('talk-response').value = parts[1].trim();
                document.getElementById('talk-followup').value = parts.slice(2).join('\n\n').trim();
            } else {
                // 完全无法拆分，全部放入要点
                document.getElementById('talk-points').value = txt;
            }
        }
    } catch (e) {
        console.error(e);
        toast('AI生成失败', 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '👤 处置建议';
};

window.submitAbsence = async function() {
    const wk = parseInt(document.getElementById('absence-week').value) || getWeek();
    const date = document.getElementById('absence-date').value;
    if (!date) { toast('请选择日期', 'error'); return; }

    const checkedStudents = new Set();
    document.querySelectorAll('#absence-tbody input[type="checkbox"][data-student]:checked').forEach(cb => {
        checkedStudents.add(cb.dataset.student);
    });
    if (checkedStudents.size === 0) { toast('请至少勾选一名学生', 'error'); return; }

    let totalRecords = 0;
    const periodLabels = { am: '早上', pm: '下午', eve: '晚上' };

    // 通用节次处理（旷课/迟到/早退/旷操）
    async function processPeriods(student, periods, code, reasonPrefix, pt) {
        if (!periods.length) return;
        const am = periods.filter(p => p >= 1 && p <= 4);
        const pm = periods.filter(p => p >= 5 && p <= 6);
        const eve = periods.filter(p => p >= 7 && p <= 8);
        const points = (code === 'A1' ? -2 : pt);
        if (am.length) {
            await sb.from('score_log').insert({ student, date, week: wk, code, reason: `${reasonPrefix}上午${am.length}节（第${am.join(',')}节）`, value: am.length * points, operator: '班主任', basis: '缺旷登记' });
            totalRecords++;
        }
        if (pm.length) {
            await sb.from('score_log').insert({ student, date, week: wk, code, reason: `${reasonPrefix}下午${pm.length}节（第${pm.join(',')}节）`, value: pm.length * points, operator: '班主任', basis: '缺旷登记' });
            totalRecords++;
        }
        if (eve.length) {
            const eveCode = (code === 'A1' ? 'A3' : code);
            const evePoints = (code === 'A1' ? -5 : pt);
            await sb.from('score_log').insert({ student, date, week: wk, code: eveCode, reason: `${reasonPrefix}晚自习${eve.length}节（第${eve.join(',')}节）`, value: eve.length * evePoints, operator: '班主任', basis: '缺旷登记' });
            totalRecords++;
        }
    }

    const allRows = document.querySelectorAll('#absence-tbody tr');
    for (const row of allRows) {
        const checkbox = row.querySelector('input[type="checkbox"][data-student]');
        if (!checkbox || !checkbox.checked) continue;
        const student = checkbox.dataset.student;

        // 旷课
        const truancySelect = row.querySelector('select[data-type="TRUANCY"]');
        if (truancySelect) {
            const selected = Array.from(truancySelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A1', '旷课：', -2);
        }
        // 迟到
        const lateSelect = row.querySelector('select[data-type="LATE"]');
        if (lateSelect) {
            const selected = Array.from(lateSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A2', '迟到：', -0.5);
        }
        // 早退
        const earlySelect = row.querySelector('select[data-type="LEAVE_EARLY"]');
        if (earlySelect) {
            const selected = Array.from(earlySelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A2', '早退：', -0.5);
        }
        // 旷操
        const noExerciseSelect = row.querySelector('select[data-type="NO_EXERCISE"]');
        if (noExerciseSelect) {
            const selected = Array.from(noExerciseSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A4', '旷操：', -1);
        }

        // ========== 请假处理（支持节次合并 + 连续累计扣分） ==========
        const leaveSelect = row.querySelector('select[data-type="LEAVE_PERIOD"]');
        if (leaveSelect) {
            const selected = Array.from(leaveSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) {
                // 当前选择的节次统计
                const curAm = selected.filter(p => p >= 1 && p <= 4).length;
                const curPm = selected.filter(p => p >= 5 && p <= 6).length;
                const curEve = selected.filter(p => p >= 7 && p <= 8).length;

                // 查询当天是否已有请假记录
                const { data: existing } = await sb.from('score_log')
                    .select('*')
                    .eq('student', student)
                    .eq('date', date)
                    .eq('code', '请假')
                    .maybeSingle();

                let mergedAm = curAm, mergedPm = curPm, mergedEve = curEve;
                if (existing) {
                    // 解析旧记录中的节次（格式：上午X节，下午Y节，晚自习Z节）
                    const oldReason = existing.reason || '';
                    const parsePeriod = (text, keyword) => {
                        const regex = new RegExp(`${keyword}(\\d+)节`);
                        const match = text.match(regex);
                        return match ? parseInt(match[1]) : 0;
                    };
                    mergedAm += parsePeriod(oldReason, '上午');
                    mergedPm += parsePeriod(oldReason, '下午');
                    mergedEve += parsePeriod(oldReason, '晚自习');
                }

                // 计算合并后的总天数
                let totalDays = (mergedAm > 0 ? 0.5 : 0) + (mergedPm > 0 ? 0.5 : 0) + (mergedEve > 0 ? 0.5 : 0);

                const amStr = mergedAm > 0 ? `上午${mergedAm}节` : '';
                const pmStr = mergedPm > 0 ? `下午${mergedPm}节` : '';
                const eveStr = mergedEve > 0 ? `晚自习${mergedEve}节` : '';
                const desc = [amStr, pmStr, eveStr].filter(Boolean).join('，');

                // 连续请假天数计算（扣除当天后查询历史，再累加）
                let oldConsecutiveDays = 0;
                const dateObj = new Date(date);
                const yesterday = new Date(dateObj);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = fmt(yesterday);

                // 查询该生所有历史请假记录（不包括当天，因为即将更新）
                const { data: leaveHistory } = await sb.from('score_log')
                    .select('date, reason')
                    .eq('student', student)
                    .eq('code', '请假')
                    .neq('date', date)   // 排除当天
                    .order('date', { ascending: true });

                const parseDays = (reason) => {
                    const match = reason.match(/合计([\d.]+)天/);
                    return match ? parseFloat(match[1]) : 0;
                };

                const dailyMap = new Map();
                if (leaveHistory) {
                    leaveHistory.forEach(r => {
                        const day = r.date;
                        const days = parseDays(r.reason || '');
                        dailyMap.set(day, (dailyMap.get(day) || 0) + days);
                    });
                }

                if (dailyMap.has(yesterdayStr)) {
                    let checkDate = new Date(yesterday);
                    while (dailyMap.has(fmt(checkDate))) {
                        oldConsecutiveDays += dailyMap.get(fmt(checkDate));
                        checkDate.setDate(checkDate.getDate() - 1);
                    }
                }

                const newTotalDays = oldConsecutiveDays + totalDays;
                const oldOver = Math.max(0, oldConsecutiveDays - 1);
                const newOver = Math.max(0, newTotalDays - 1);
                const value = -(newOver - oldOver);

                                // 获取请假类型
                const leaveTypeSelect = row.querySelector('select[data-type="LEAVE_TYPE"]');
                const leaveType = leaveTypeSelect ? leaveTypeSelect.value : '事假';
                const leaveTypePrefix = leaveType === '病假' ? '【病假】' : '【事假】';
                
                let reason = `${leaveTypePrefix}请假：${desc}，合计${totalDays}天`;
                if (newTotalDays > 1) {
                    reason += `（连续累计${newTotalDays}天，超期${newOver.toFixed(1)}天，本次扣${Math.abs(value)}分）`;
                }

                // 删除当天旧记录（实现合并更新）
                if (existing) {
                    await sb.from('score_log').delete().eq('id', existing.id);
                }

                await sb.from('score_log').insert({
                    student, date, week: wk, code: '请假',
                    reason, value, operator: '班主任', basis: '缺旷登记'
                });
                totalRecords++;
            }
        }

        // 自定义事项（多个时段合并为一条记录，代码Z3）
        const customPeriodSelect = row.querySelector('select[data-type="CUSTOM_PERIOD"]');
        const customDescInput = row.querySelector('input[data-type="CUSTOM_DESC"]');
        if (customPeriodSelect && customDescInput) {
            const selectedPeriods = Array.from(customPeriodSelect.selectedOptions).map(o => o.value);
            const descText = customDescInput.value.trim();
            if (selectedPeriods.length && descText) {
                const allLabels = selectedPeriods.map(p => periodLabels[p] || p).join('、');
                const mergedReason = `走读/特殊事项：${allLabels} ${descText}`;
                await sb.from('score_log').insert({
                    student, date, week: wk, code: 'Z3',
                    reason: mergedReason,
                    value: 0, operator: '班主任', basis: '缺旷登记'
                });
                totalRecords++;
            }
        }
    }

    if (totalRecords === 0) { toast('没有检测到有效登记数据', 'error'); return; }
    await loadData(); renderAbsenceTable(); refreshDashboard(); window.renderScoreLog();
    toast(`已提交 ${totalRecords} 条记录`);
};// ==================== 周违纪登记 ====================

    window.saveWeeklyData = async function() {
    const wk = parseInt(document.getElementById('weekly-week-num').value) || getWeek();
    const entries = [];
    document.querySelectorAll('#weekly-tbody tr').forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (!inputs.length) return;
        const name = inputs[0].dataset.student;
        const d = { week: wk, student: name };
        inputs.forEach(inp => { d[inp.dataset.day] = inp.value; });
        entries.push(d);
    });
    await sb.from('weekly_data').delete().eq('week', wk);
    if (entries.length) await sb.from('weekly_data').insert(entries);

    const allDeduct = getDeductCodes();
    const allBonus = getBonusCodes();

    for (const e of entries) {
        for (const day of ['mon', 'tue', 'wed', 'thu', 'fri']) {
            const val = e[day]?.trim();
            if (!val) continue;
            const parts = val.split(/\s+/);
            const code = parts[0];
            const score = parseFloat(parts[1]);
            if (!code || isNaN(score)) continue;

            const deductItem = allDeduct.find(c => c.code === code);
            const bonusItem = allBonus.find(c => c.code === code);
            const desc = deductItem?.desc || bonusItem?.desc || '';
            const action = score > 0 ? '加分' : '违纪';
            const reasonText = desc
                ? `${dayNames[day]}${action}：${desc}（${code}）`
                : `${dayNames[day]}${action}（${code}）`;

            await sb.from('score_log').insert({
                student: e.student, date: today, week: wk,
                code: code, reason: reasonText,
                value: score, operator: '班干', basis: '周表'
            });
        }

window.showAttendanceDetail = async function(date, field) {
    // 动态创建模态框（若不存在）
    let modal = document.getElementById('modal-attendance-detail');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-attendance-detail';
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content" style="max-width:400px;">
                <h3 id="att-detail-title">学生名单</h3>
                <div id="att-detail-list" style="max-height:60vh; overflow-y:auto; margin-bottom:12px;"></div>
                <button class="btn-outline" onclick="window.closeModal('modal-attendance-detail')">关闭</button>
            </div>`;
        document.body.appendChild(modal);
    }

    const titleEl = document.getElementById('att-detail-title');
    const listEl = document.getElementById('att-detail-list');
    titleEl.textContent = '加载中...';
    listEl.innerHTML = '<p>正在查询...</p>';
    openModal('modal-attendance-detail');

    try {
        // 查询当天所有缺旷登记记录
        const { data: dayLogs, error } = await sb.from('score_log')
            .select('*')
            .eq('date', date)
            .eq('basis', '缺旷登记');
        if (error) throw error;

        const absentAM = new Set();
        const absentPM = new Set();
        const absentEVE = new Set();
        const leaveSet = new Set();

        (dayLogs || []).forEach(l => {
            const student = l.student;
            const reason = l.reason || '';

            if (l.code === '请假') {
                leaveSet.add(student);
                if (reason.includes('上午')) absentAM.add(student);
                if (reason.includes('下午')) absentPM.add(student);
                if (reason.includes('晚自习')) absentEVE.add(student);
            } else if (l.code === 'A1' || l.code === 'A3') {
                if (reason.includes('上午')) absentAM.add(student);
                if (reason.includes('下午')) absentPM.add(student);
                if (reason.includes('晚自习')) absentEVE.add(student);
            } else if (l.code === 'A2' || l.code === 'A4') {
                absentAM.add(student);
                absentPM.add(student);
            } else if ((l.code === 'Z1' || l.code === 'Z3') && 
                     (reason.startsWith('特殊事项：') || reason.startsWith('走读/特殊事项：'))) {
                const detail = reason.replace('特殊事项：', '').replace('走读/特殊事项：', '');
                if (detail.includes('早上') || detail.includes('上午')) absentAM.add(student);
                if (detail.includes('下午')) absentPM.add(student);
                if (detail.includes('晚上') || detail.includes('晚自习')) absentEVE.add(student);
            }
        });

        let selectedSet;
        let typeText;
        if (field === 'leave') {
            selectedSet = leaveSet;
            typeText = '请假';
        } else if (field === 'absent_am') {
            selectedSet = absentAM;
            typeText = '上午缺勤/请假';
        } else if (field === 'absent_pm') {
            selectedSet = absentPM;
            typeText = '下午缺勤/请假';
        } else if (field === 'absent_eve') {
            selectedSet = absentEVE;
            typeText = '晚自习缺勤/请假';
        } else {
            selectedSet = new Set();
            typeText = '未知';
        }

        const names = Array.from(selectedSet).sort();
        titleEl.textContent = `${date} ${typeText}名单 (${names.length}人)`;
        listEl.innerHTML = names.length
            ? names.map(n => `<div style="padding:4px 0; border-bottom:1px solid #eee;">${n}</div>`).join('')
            : '<p>无</p>';
    } catch (e) {
        console.error(e);
        titleEl.textContent = '查询出错';
        listEl.innerHTML = `<p style="color:red;">${e.message || e}</p>`;
    }
};
window.renderWeeklySummary = function() {
    const wk = parseInt(document.getElementById('summary-week-num').value);
    if (isNaN(wk)) { toast('请输入周次', 'error'); return; }

    const weekLogs = logs.filter(l => l.week === wk);
    // 按学生分组
    const groups = {};
    weekLogs.forEach(l => {
        if (!groups[l.student]) groups[l.student] = [];
        groups[l.student].push(l);
    });

    // 生成表格内容
    const activeStudents = students.filter(s => s.status === '在读');
    const tbody = document.getElementById('weekly-summary-tbody');
    if (activeStudents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2">暂无在读学生</td></tr>';
        return;
    }

        let html = '';
    activeStudents.forEach(s => {
        const records = groups[s.name] || [];
        // 计算本周合计
        const weekTotal = records.reduce((sum, r) => sum + (r.value || 0), 0);
        const weekTotalStr = weekTotal === 0 ? '0' : (weekTotal > 0 ? '+' + weekTotal : weekTotal.toString());
        // 当前操行分
        const currentScore = calcScore(s.name);
        
        if (records.length === 0) {
            html += `<tr><td>${s.name}</td><td style="color:var(--text-secondary);">无记录</td><td>0</td><td>${currentScore}</td></tr>`;
        } else {
            records.sort((a, b) => new Date(a.date) - new Date(b.date));
            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const items = records.map((r, i) => {
                const d = new Date(r.date);
                const weekday = dayNames[d.getDay()];
                const codeDesc = r.code ? ` ${r.code}：` : '';
                const reason = r.reason || '';
                const value = r.value || 0;
                const valueStr = value !== 0 ? `（${value > 0 ? '+' : ''}${value}分）` : '';
                return `${i + 1}.${weekday}${codeDesc}${reason}${valueStr}`;
            });
            const summary = items.join('；');
            html += `<tr><td>${s.name}</td><td style="white-space:pre-wrap;">${summary}</td><td style="font-weight:bold; color:${weekTotal >= 0 ? '#10b981' : '#ef4444'}">${weekTotalStr}</td><td>${currentScore}</td></tr>`;
        }
    });
    tbody.innerHTML = html;
};
// 导出周操行汇总为 Excel (CSV)
window.exportWeeklySummary = function() {
    const table = document.getElementById('weekly-summary-table');
    if (!table) return;
    const rows = table.querySelectorAll('tr');
    if (rows.length <= 1) { toast('没有数据可导出', 'error'); return; }

    // 构建CSV内容
    let csvContent = '\uFEFF'; // BOM for Chinese
    rows.forEach(row => {
        const cols = row.querySelectorAll('th, td');
        const rowData = [];
        cols.forEach(col => {
            // 处理单元格内可能存在的逗号或引号
            let text = col.innerText || '';
            text = text.replace(/"/g, '""'); // 双引号转义
            if (text.includes(',') || text.includes('"') || text.includes('\n')) {
                text = `"${text}"`;
            }
            rowData.push(text);
        });
        csvContent += rowData.join(',') + '\n';
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const wk = document.getElementById('summary-week-num')?.value || '';
    link.download = `周操行汇总_第${wk}周.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    toast('导出成功');
};

// 自动识别周/月奖励（全勤按周，团结/进步按月，自动去重，严格时间）
window.autoAddWeeklyBonus = async function() {
    // 防连点锁
    if (window._addingBonusLock) { toast('正在处理中，请稍候...', 'warning'); return; }
    window._addingBonusLock = true;

    try {
        const wk = parseInt(document.getElementById('summary-week-num').value);
        if (isNaN(wk)) { toast('请先选择周次', 'error'); return; }

        const saved = localStorage.getItem('semester_config');
        if (!saved) { toast('请先设置学期开学日期', 'error'); return; }
        const cfg = JSON.parse(saved);
        const semesterStart = new Date(cfg.startDate);
        
        // 本周起止（周一~周日 23:59:59）
        const weekStart = new Date(semesterStart);
        weekStart.setDate(weekStart.getDate() + (wk - 1) * 7);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        weekEnd.setHours(23, 59, 59, 999);

        const now = new Date();
        const isWeekOver = now >= weekEnd;

        // 月份信息
        const month = weekStart.getMonth() + 1;
        const year = weekStart.getFullYear();
        const monthStart = `${year}-${String(month).padStart(2,'0')}-01`;
        // 本月最后一天 23:59:59
        const lastDayOfMonth = new Date(year, month, 0, 23, 59, 59, 999);
        const monthEndStr = lastDayOfMonth.toISOString().split('T')[0];
        const isMonthOver = now >= lastDayOfMonth;

        const activeStudents = students.filter(s => s.status === '在读');
        const weekLogs = logs.filter(l => l.week === wk);
        const allLogs = logs;

        let addedCount = 0;

        for (const s of activeStudents) {
            const name = s.name;
            const myWeekLogs = weekLogs.filter(l => l.student === name);
            const myMonthLogs = allLogs.filter(l => 
                l.student === name && l.date >= monthStart && l.date <= monthEndStr
            );

            // ========== 全勤奖：本周无扣分、无请假、有记录，且周已过 ==========
            if (isWeekOver) {
                const hasDeduction = myWeekLogs.some(l => l.value < 0);
                const hasLeave = myWeekLogs.some(l => l.code === '请假');
                const hasRecord = myWeekLogs.length > 0;
                
                if (hasRecord && !hasDeduction && !hasLeave) {
                    // 先删除该生本周所有 P1 自动加分记录，再插入一条（保证唯一）
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .eq('week', wk)
                        .eq('code', 'P1')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: fmt(weekEnd),
                        week: wk,
                        code: 'P1',
                        reason: `第${wk}周全勤（自动识别）`,
                        value: 1,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }

            // ========== 团结奖：当月无冲突代码，且月已过 ==========
            if (isMonthOver) {
                const conflictCodes = ['C9', 'C10', 'C12'];
                const hasConflict = myMonthLogs.some(l => conflictCodes.includes(l.code));
                
                if (!hasConflict) {
                    // 删除该生本月所有 U1 自动加分记录，再插入
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .gte('date', monthStart)
                        .lte('date', monthEndStr)
                        .eq('code', 'U1')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: monthEndStr,
                        week: wk,
                        code: 'U1',
                        reason: `${month}月团结无纠纷（自动识别）`,
                        value: 1,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }

            // ========== 进步奖：当月有扣分且加分，月已过 ==========
            if (isMonthOver) {
                const hasDeductionMonth = myMonthLogs.some(l => l.value < 0);
                const hasBonusMonth = myMonthLogs.some(l => l.value > 0);
                
                if (hasDeductionMonth && hasBonusMonth) {
                    // 删除该生本月所有 U2 自动加分记录，再插入
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .gte('date', monthStart)
                        .lte('date', monthEndStr)
                        .eq('code', 'U2')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: monthEndStr,
                        week: wk,
                        code: 'U2',
                        reason: `${month}月表现进步（自动识别，班主任可调整）`,
                        value: 2,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }
        }

        await loadData();
        window.renderWeeklySummary();
        
        let msg = `自动识别完成，新增 ${addedCount} 人次奖励。`;
        if (!isWeekOver) msg += '（本周未结束，全勤暂不处理）';
        if (!isMonthOver) msg += '（本月未结束，团结/进步暂不处理）';
        toast(msg);
    } catch (e) {
        console.error(e);
        toast('自动加分出错：' + e.message, 'error');
    } finally {
        window._addingBonusLock = false;
    }
};

;// 作息时间表（基于福泉市中等职业学校作息时间）
const schedule = [
    { name: '第一节',   start: [8,30], end: [9,10], period: 1, timeLabel: '上午' },
    { name: '第二节',   start: [9,20], end: [10,0], period: 2, timeLabel: '上午' },
    { name: '课间操',   start: [10,0], end: [10,30], period: null, timeLabel: null },
    { name: '第三节',   start: [10,30], end: [11,10], period: 3, timeLabel: '上午' },
    { name: '第四节',   start: [11,20], end: [12,0], period: 4, timeLabel: '上午' },
    { name: '第五节',   start: [14,30], end: [15,10], period: 5, timeLabel: '下午' },
    { name: '第六节',   start: [15,20], end: [16,0], period: 6, timeLabel: '下午' },
    { name: '第七节',   start: [16,10], end: [16,50], period: 7, timeLabel: '下午' },
    { name: '晚自习一', start: [19,0], end: [19,50], period: 1, timeLabel: '晚自习' },   // 晚自习内部节次重新编号为1、2
    { name: '晚自习二', start: [20,0], end: [21,0], period: 2, timeLabel: '晚自习' }
];
// 根据当前时间获取当前节次信息
function getCurrentPeriod() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    for (const item of schedule) {
        const [sh, sm] = item.start;
        const [eh, em] = item.end;
        if (h > sh || (h === sh && m >= sm)) {
            if (h < eh || (h === eh && m < em)) {
                return item;
            }
        }
    }
    return null; // 非上课时间
}
// 计算当前节次的实到和缺旷人数
function getCurrentAttendance() {
    const periodInfo = getCurrentPeriod();
    if (!periodInfo || !periodInfo.period) {
        return { label: '非上课时间', present: '-', absent: '-' };
    }

    const today = fmt(new Date());
    const todayLogs = logs.filter(l => l.date === today && l.basis === '缺旷登记');

    // 晚自习只统计住校生，其他时段统计全部在读学生
    let allActive = [];
    if (periodInfo.timeLabel === '晚自习') {
        allActive = students.filter(s => s.status === '在读' && s.zoudu !== '是');
    } else {
        allActive = students.filter(s => s.status === '在读');
    }
    const total = allActive.length;

    const absentSet = new Set();
    for (const l of todayLogs) {
        const student = l.student;
        const code = l.code;
        const reason = l.reason || '';

        // 1. 请假：时段匹配
        if (code === '请假') {
            if (periodInfo.timeLabel === '上午' && reason.includes('上午')) absentSet.add(student);
            else if (periodInfo.timeLabel === '下午' && reason.includes('下午')) absentSet.add(student);
            else if (periodInfo.timeLabel === '晚自习' && reason.includes('晚自习')) absentSet.add(student);
            continue;
        }

        // 2. 旷课（A1/A3）：时段匹配且节次匹配（若没有节次则默认整时段缺勤）
        if (code === 'A1' || code === 'A3') {
            let timeLabel = null;
            if (reason.includes('上午')) timeLabel = '上午';
            else if (reason.includes('下午')) timeLabel = '下午';
            else if (reason.includes('晚自习')) timeLabel = '晚自习';
            if (timeLabel !== periodInfo.timeLabel) continue;

            const periodMatch = reason.match(/第([\d,]+)节/);
            if (periodMatch) {
                const periods = periodMatch[1].split(',').map(Number);
                if (periods.includes(periodInfo.period)) absentSet.add(student);
            } else {
                absentSet.add(student); // 无具体节次，默认该时段缺勤
            }
            continue;
        }

        // 3. 迟到/早退/旷操（A2/A4）：影响所在整个时段（仅限上午/下午）
        if (code === 'A2' || code === 'A4') {
            if (periodInfo.timeLabel === '上午' || periodInfo.timeLabel === '下午') {
                absentSet.add(student);
            }
            continue;
        }

        // 4. 自定义事项（Z1/Z3）：根据时段描述计入缺勤（与仪表盘规则一致）
        if ((code === 'Z1' || code === 'Z3') && 
            (reason.startsWith('特殊事项：') || reason.startsWith('走读/特殊事项：'))) {
            const detail = reason.replace('特殊事项：', '').replace('走读/特殊事项：', '');
            if (periodInfo.timeLabel === '上午' && (detail.includes('早上') || detail.includes('上午'))) {
                absentSet.add(student);
            } else if (periodInfo.timeLabel === '下午' && detail.includes('下午')) {
                absentSet.add(student);
            } else if (periodInfo.timeLabel === '晚自习' && (detail.includes('晚上') || detail.includes('晚自习'))) {
                absentSet.add(student);
            }
        }
    }

    // 晚自习剔除走读生（防止误登记走读生晚自习缺勤）
    if (periodInfo.timeLabel === '晚自习') {
        const zhuxiaoNames = new Set(allActive.map(s => s.name));
        for (const absent of absentSet) {
            if (!zhuxiaoNames.has(absent)) absentSet.delete(absent);
        }
    }

    const present = total - absentSet.size;
    const label = periodInfo.timeLabel === '晚自习' 
        ? periodInfo.name + '（住校）' 
        : periodInfo.name;

    return {
        label: label,
        present: present,
        absent: absentSet.size
    };
}

// ========== 累计处分预警 ==========
window.renderDisciplineWarning = function() {
    const activeStudents = students.filter(s => s.status === '在读');
    const result = [];

    activeStudents.forEach(s => {
        const myLogs = logs.filter(l => l.student === s.name);
        let absentPeriods = 0;   // 旷课节数
        let personalLeave = 0;   // 事假节数
        let sickLeave = 0;       // 病假节数
        let lateEarlyCount = 0;  // 迟到/早退次数

        myLogs.forEach(l => {
            const reason = l.reason || '';
            if (l.code === 'A1' || l.code === 'A3') {
                // 旷课：提取节数
                const am = (reason.match(/上午(\d+)节/) || [0,0])[1];
                const pm = (reason.match(/下午(\d+)节/) || [0,0])[1];
                const eve = (reason.match(/晚自习(\d+)节/) || [0,0])[1];
                absentPeriods += parseInt(am) + parseInt(pm) + parseInt(eve);
            } else if (l.code === 'A2' || l.code === 'A4') {
                lateEarlyCount++;
            } else if (l.code === '请假') {
                 // 若没有【事假】或【病假】前缀，旧记录默认视为病假
                const isSick = reason.startsWith('【病假】') || (!reason.startsWith('【事假】') && !reason.startsWith('【病假】'));
                const am = (reason.match(/上午(\d+)节/) || [0,0])[1];
                const pm = (reason.match(/下午(\d+)节/) || [0,0])[1];
                const eve = (reason.match(/晚自习(\d+)节/) || [0,0])[1];
                const periods = parseInt(am) + parseInt(pm) + parseInt(eve);
                if (isSick) {
                    sickLeave += periods;
                } else {
                    personalLeave += periods;
                }
            }
        });

        // 迟到/早退2次折合1节旷课
        absentPeriods += Math.floor(lateEarlyCount / 2);

        // 处分判断（仅针对事假和旷课）
        const disciplineLevels = [
            { maxAbsent: 21, maxLeave: 35, level: '警告处分' },
            { maxAbsent: 35, maxLeave: 56, level: '严重警告处分' },
            { maxAbsent: 50, maxLeave: 70, level: '记过处分' },
            { maxAbsent: 80, maxLeave: 90, level: '留校察看处分' },
            { maxAbsent: 90, maxLeave: 999, level: '自动退学' }
        ];

        let suggestion = '—';
        for (const level of disciplineLevels) {
            if (absentPeriods >= level.maxAbsent || personalLeave >= level.maxLeave) {
                suggestion = level.level;
            }
        }

        result.push({ 
            name: s.name, 
            absent: absentPeriods, 
            personal: personalLeave, 
            sick: sickLeave, 
            suggestion 
        });
    });

    // 渲染表格
    const tbody = document.getElementById('discipline-tbody');
    if (!tbody) return;
    tbody.innerHTML = result.map(r => `
        <tr>
            <td>${r.name}</td>
            <td>${r.absent}</td>
            <td>${r.personal}</td>
            <td>${r.sick}</td>
            <td style="color:${r.suggestion === '—' ? '#10b981' : '#ef4444'}; font-weight:bold;">${r.suggestion}</td>
        </tr>
    `).join('');
};

                        </select></div>
                    </div>
                    <input id="pv-reason" placeholder="补充说明（可选）">
                    <div style="text-align:right; margin-top:12px;">
                        <button class="btn-outline" onclick="window.closeModal('modal-phone-violation')">取消</button>
                        <button class="btn-primary" onclick="window.savePhoneViolation()">保存</button>
                    </div>
                </div>
            </div>
        `);
    }
    // 填充学生列表
    const sel = document.getElementById('pv-student');
    sel.innerHTML = '<option value="">-- 选择学生 --</option>';
    students.filter(s => s.status === '在读').forEach(s => {
        sel.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    });
    openModal('modal-phone-violation');
};

window.savePhoneViolation = async function() {
    const student = document.getElementById('pv-student').value;
    const times = document.getElementById('pv-times').value;
    const reason = document.getElementById('pv-reason').value.trim();
    if (!student) { toast('请选择学生', 'error'); return; }

    const code = times === '1' ? 'M1' : 'M2';
    const desc = times === '1' ? '手机违规第1次（代管一周）' : `手机违规第${times}次`;
    const pt = times === '1' ? 0 : -10;

    const { error } = await sb.from('score_log').insert({
        student, date: fmt(new Date()), week: getWeek(), code,
        reason: reason ? `${desc} - ${reason}` : desc,
        value: pt, operator: '班主任', basis: '直接记录'
    });
    if (error) { toast('保存失败：' + error.message, 'error'); return; }

    closeModal('modal-phone-violation');
    await loadData();
    window.renderPhoneDiscipline();
    toast('手机违规已登记');
};
window.generateAIReport = async function() {
    const container = document.getElementById('ai-report-text');
    if (!container) return;
    container.textContent = '正在生成周报，请稍候...';
    
    try {
        const wk = getWeek();
        const weekLogs = logs.filter(l => l.week === wk);
        let totalDeduct = 0, totalBonus = 0;
        const studentsSet = new Set();
        weekLogs.forEach(l => {
            const val = parseFloat(l.value) || 0;
            if (val < 0) totalDeduct += val;
            else totalBonus += val;
            studentsSet.add(l.student);
        });
        
        const systemPrompt = '你是一名中职班主任助手。请根据本周班级操行数据，用自然语气生成一份简洁的班级周报，概括整体纪律情况、突出问题、以及下周建议。直接给出内容，不要使用Markdown标记。';
        const userPrompt = `本周第${wk}周，参与评分学生${studentsSet.size}人，扣分合计${totalDeduct}分，加分合计+${totalBonus}分。请生成周报。`;
        
        const raw = await callAI(systemPrompt, userPrompt, 800);
        const cleaned = cleanMarkdown(raw).replace(/\n+/g, '\n\n').trim();
        container.textContent = cleaned || '本周暂无足够数据生成报告。';
    } catch (e) {
        console.error('AI周报生成失败:', e);
        container.textContent = 'AI周报生成失败，请稍后重试。';
    }
};
window.onload = init;
})();
</script>
