function getWeek() {
    const saved = localStorage.getItem('semester_config');
    if (saved) {
        const cfg = JSON.parse(saved);
        const start = new Date(cfg.startDate);      // 学期第一天
        const total = parseInt(cfg.totalWeeks) || 20;
        const now = new Date();
        const diffDays = Math.floor((now - start) / (24 * 60 * 60 * 1000));
        if (diffDays < 0) return 1;                 // 还没开学，显示第 1 周
        const week = Math.ceil((diffDays + 1) / 7); // 第 1 周从开学第一天开始
        return Math.min(week, total);               // 不能超过总周数
    }
    // 未配置时，回退到原来的 ISO 周次计算
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), 0, 1);
    const days = Math.floor((now - firstDay) / (24 * 60 * 60 * 1000));
    return Math.ceil((days + firstDay.getDay() + 1) / 7);
}
// 根据身份证号计算周岁年龄
function getAgeFromIdcard(idcard) {
    if (!idcard || idcard.length !== 18) return '';
    const birthStr = idcard.substring(6, 14);
    const birthYear = parseInt(birthStr.substring(0, 4));
    const birthMonth = parseInt(birthStr.substring(4, 6)) - 1;
    const birthDay = parseInt(birthStr.substring(6, 8));
    const birthDate = new Date(birthYear, birthMonth, birthDay);
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;

<div class="page" id="page-rules">
            <div class="card">
                <h2>📜 学生考勤制度</h2>
                <div style="font-size:13px; line-height:1.8; white-space:pre-wrap;">
（一）学生必须遵守学校各项规章制度，按时到校上课，凡因病、因事不能上课者，应和班主任老师请假，否则作旷课处理；上课前擅离教室（或现场）者作早退处理。

（二）每班设立教学日志。每节课（包括自习、劳动、集合等）均应由班主任、任课老师点名登记，学生考勤每周由班主任在班内公布一次，每月由政教处向全校公布一次，学期结束时，须将学生出勤情况记入学生学籍表和学生档案。

（三）学生请病、事假须有家长或医生证明，请假三天以内的由班主任签核实意见后送政教处审批，请假三天以上，征得家长意见后，由校级领导审批，学生因急事或因病来不及请假者，应在回校两天内持证办理补假手续。

（四）有慢性病不能坚持学习的学生，凭医院证明申请休学一年，休学期满后应回校办理复学手续，经医院证明病未愈，不能复学者，可继续休学一年。

（五）一学期累计旷课达到21课时，或请事假累计达到35课时者，给予警告处分；累计旷课达到35课时，或请事假累计达到56课时者，给予严重警告处分；累计旷课达到50课时，或请事假累计达到70课时者，给予记过处分；累计旷课达到80课时，或请事假累计达到90课时者，给予留校察看处分；累计旷课达到90课时，或无故离校连续两周者，作自动退学处理。自动退学的学生，从处分之日起，取消其学籍。

（六）迟到、早退2次当旷课一节，请事假10节当旷课一节。
                </div>
            </div>
            <div class="card">
                <h2>📱 手机使用管理规定（试行）</h2>
                <div style="font-size:13px; line-height:1.8; white-space:pre-wrap;">
中职学生正值集中精力、努力学习的时期，学校一直不提倡学生追求生活的奢侈。学生使用手机在方便联络的同时，也给学生的学习、财物的保管、学校的管理和课堂教学的正常秩序带来很大的负面影响。根据大部分家长的要求并结合我校的实际情况，特制订学生携带手机暨使用管理规定，请全体同学自觉遵守。

第一条 学校绝不提倡学生在校期间使用手机，确实需要使用的要妥善保管好自己的手机，如有丢失由学生个人负责。

第二条 原则上不带手机到校，如需带手机到学校的学生请在指定地点（寝室）和指点时间（晚上9.00-10.30）内使用。（出寝室时请自觉放保管柜，由教官、宿管代管。）禁止学生带手机到教室。

第三条 禁止学生在教学时间（考试、实习、自习、上课等）使用手机。

第四条 禁止学生在集会时间（早操、课间操、校会、升旗仪式等）使用手机。

第五条 禁止学生在走路时使用手机玩游戏、看小说等长时间使用手机。

第六条 学生晚上熄灯22：30分之后，应将手机关机或设为静音状态放回手机柜，严禁使用手机在宿舍区聊天、大声喧哗，影响他人休息。

        // 清理 Markdown 标记，去除 AI 味道
    function cleanMarkdown(text) {
        if (!text) return text;
        return text
            .replace(/^#{1,6}\s/gm, '')      // 去除标题 #、## 等
            .replace(/\*{1,2}([^*]+)\*{1,2}/g, '$1') // 去除加粗和斜体
            .replace(/~~([^~]+)~~/g, '$1')   // 去除删除线
            .replace(/`{1,3}[^`]*`{1,3}/g, '') // 去除行内代码
            .replace(/^- /gm, '')            // 去除无序列表短横
            .replace(/^\d+\. /gm, '')        // 去除有序列表数字
            .replace(/\n{2,}/g, '\n\n')      // 减少连续空行
            .trim();
    }

// 点击出勤历史人数，弹窗查看具体学生名单
window.showAttendanceDetail = async function(date, field) {
    // 动态创建模态框（若不存在）
    let modal = document.getElementById('modal-attendance-detail');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-attendance-detail';
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content" style="max-width:400px;">
                <h3 id="att-detail-title">学生名单</h3>
                <div id="att-detail-list" style="max-height:60vh; overflow-y:auto; margin-bottom:12px;"></div>
                <button class="btn-outline" onclick="window.closeModal('modal-attendance-detail')">关闭</button>
            </div>`;
        document.body.appendChild(modal);
    }

    const titleEl = document.getElementById('att-detail-title');
    const listEl = document.getElementById('att-detail-list');
    titleEl.textContent = '加载中...';
    listEl.innerHTML = '<p>正在查询...</p>';
    openModal('modal-attendance-detail');

    try {
        // 查询当天所有缺旷登记记录
        const { data: dayLogs, error } = await sb.from('score_log')
            .select('*')
            .eq('date', date)
            .eq('basis', '缺旷登记');
        if (error) throw error;

        const absentAM = new Set();
        const absentPM = new Set();
        const absentEVE = new Set();
        const leaveSet = new Set();

        (dayLogs || []).forEach(l => {
            const student = l.student;
            const reason = l.reason || '';

            if (l.code === '请假') {
                leaveSet.add(student);
                if (reason.includes('上午')) absentAM.add(student);
                if (reason.includes('下午')) absentPM.add(student);
                if (reason.includes('晚自习')) absentEVE.add(student);
            } else if (l.code === 'A1' || l.code === 'A3') {
                if (reason.includes('上午')) absentAM.add(student);
                if (reason.includes('下午')) absentPM.add(student);
                if (reason.includes('晚自习')) absentEVE.add(student);
            } else if (l.code === 'A2' || l.code === 'A4') {
                absentAM.add(student);
                absentPM.add(student);
            } else if ((l.code === 'Z1' || l.code === 'Z3') && 
                     (reason.startsWith('特殊事项：') || reason.startsWith('走读/特殊事项：'))) {
                const detail = reason.replace('特殊事项：', '').replace('走读/特殊事项：', '');
                if (detail.includes('早上') || detail.includes('上午')) absentAM.add(student);
                if (detail.includes('下午')) absentPM.add(student);
                if (detail.includes('晚上') || detail.includes('晚自习')) absentEVE.add(student);
            }
        });

        let selectedSet;
        let typeText;
        if (field === 'leave') {
            selectedSet = leaveSet;
            typeText = '请假';
        } else if (field === 'absent_am') {
            selectedSet = absentAM;
            typeText = '上午缺勤/请假';
        } else if (field === 'absent_pm') {
            selectedSet = absentPM;
            typeText = '下午缺勤/请假';
        } else if (field === 'absent_eve') {
            selectedSet = absentEVE;
            typeText = '晚自习缺勤/请假';
        } else {
            selectedSet = new Set();
            typeText = '未知';
        }

        const names = Array.from(selectedSet).sort();
        titleEl.textContent = `${date} ${typeText}名单 (${names.length}人)`;
        listEl.innerHTML = names.length
            ? names.map(n => `<div style="padding:4px 0; border-bottom:1px solid #eee;">${n}</div>`).join('')
            : '<p>无</p>';
    } catch (e) {
        console.error(e);

window.renderWeeklySummary = function() {
    const wk = parseInt(document.getElementById('summary-week-num').value);
    if (isNaN(wk)) { toast('请输入周次', 'error'); return; }

    const weekLogs = logs.filter(l => l.week === wk);
    const groups = {};
    weekLogs.forEach(l => {
        if (!groups[l.student]) groups[l.student] = [];
        groups[l.student].push(l);
    });

    const activeStudents = students.filter(s => s.status === '在读');
    const tbody = document.getElementById('weekly-summary-tbody');
    if (activeStudents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2">暂无在读学生</td></tr>';
        return;
    }

    const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const allDeduct = getDeductCodes();
    const allBonus = getBonusCodes();

    let html = '';
    activeStudents.forEach(s => {
        const records = groups[s.name] || [];
        const weekTotal = records.reduce((sum, r) => sum + (r.value || 0), 0);
        const weekTotalStr = weekTotal === 0 ? '0' : (weekTotal > 0 ? '+' + weekTotal : weekTotal.toString());
        const currentScore = calcScore(s.name);

        if (records.length === 0) {
            html += `<tr><td>${s.name}</td><td style="color:var(--text-secondary);">无记录</td><td>0</td><td>${currentScore}</td></tr>`;
        } else {
            records.sort((a, b) => new Date(a.date) - new Date(b.date));
            const items = records.map((r, i) => {
                const d = new Date(r.date);
                const weekday = dayNames[d.getDay()];
                // 查找代码描述
                const codeItem = allDeduct.find(c => c.code === r.code) || allBonus.find(c => c.code === r.code);
                const codeDesc = codeItem ? (codeItem.description || codeItem.desc) : '';
                // 构建事由文本：如果 reason 中已包含描述，则直接使用，否则补充代码含义
                let reasonText = r.reason || '';
                if (codeDesc && !reasonText.includes(codeDesc)) {
                    // 避免重复拼接
                    if (r.code && reasonText.startsWith(r.code)) {
                        reasonText = reasonText;
                    } else {
                        reasonText = codeDesc + (reasonText ? '，' + reasonText : '');
                    }
                }
                const value = r.value || 0;
                const valueStr = value !== 0 ? `（${value > 0 ? '+' : ''}${value}分）` : '';
                return `${i + 1}.${weekday} ${r.code}：${reasonText}${valueStr}`;
            });
            const summary = items.join('；');
            html += `<tr><td>${s.name}</td><td style="white-space:pre-wrap;">${summary}</td><td style="font-weight:bold; color:${weekTotal >= 0 ? '#10b981' : '#ef4444'}">${weekTotalStr}</td><td>${currentScore}</td></tr>`;
        }
    });
    tbody.innerHTML = html;
};

// 自动识别周/月奖励（全勤按周，团结/进步按月，自动去重，严格时间）
window.autoAddWeeklyBonus = async function() {
    if (window._addingBonusLock) { toast('正在处理中，请稍候...', 'warning'); return; }
    window._addingBonusLock = true;

    try {
        const wk = parseInt(document.getElementById('summary-week-num').value);
        if (isNaN(wk)) { toast('请先选择周次', 'error'); return; }

        const saved = localStorage.getItem('semester_config');
        if (!saved) { toast('请先设置学期开学日期', 'error'); return; }
        const cfg = JSON.parse(saved);
        const semesterStart = new Date(cfg.startDate);
        
        const weekStart = new Date(semesterStart);
        weekStart.setDate(weekStart.getDate() + (wk - 1) * 7);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        weekEnd.setHours(23, 59, 59, 999);

        const now = new Date();
        const isWeekOver = now >= weekEnd;

        const month = weekStart.getMonth() + 1;
        const year = weekStart.getFullYear();
        const monthStart = `${year}-${String(month).padStart(2,'0')}-01`;
        const lastDayOfMonth = new Date(year, month, 0, 23, 59, 59, 999);
        const monthEndStr = lastDayOfMonth.toISOString().split('T')[0];
        const isMonthOver = now >= lastDayOfMonth;

        const activeStudents = students.filter(s => s.status === '在读');
        const weekLogs = logs.filter(l => l.week === wk);
        const allLogs = logs;

        let addedCount = 0;

        for (const s of activeStudents) {
            const name = s.name;
            const myWeekLogs = weekLogs.filter(l => l.student === name);
            const myMonthLogs = allLogs.filter(l => 
                l.student === name && l.date >= monthStart && l.date <= monthEndStr
            );

            // ========== 全勤奖（无扣分、无请假、无Z3，无记录也全勤） ==========
            if (isWeekOver) {
                const hasDeduction = myWeekLogs.some(l => l.value < 0);
                const hasLeave = myWeekLogs.some(l => l.code === '请假');
                const hasSpecial = myWeekLogs.some(l => l.code === 'Z3');
                
                if (!hasDeduction && !hasLeave && !hasSpecial) {
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .eq('week', wk)
                        .eq('code', 'P1')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: fmt(weekEnd),
                        week: wk,
                        code: 'P1',
                        reason: `第${wk}周全勤（自动识别）`,
                        value: 1,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }

            // ========== 团结奖 ==========
            if (isMonthOver) {
                const conflictCodes = ['C9', 'C10', 'C12'];
                const hasConflict = myMonthLogs.some(l => conflictCodes.includes(l.code));
                if (!hasConflict) {
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .gte('date', monthStart)
                        .lte('date', monthEndStr)
                        .eq('code', 'U1')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: monthEndStr,
                        week: wk,
                        code: 'U1',
                        reason: `${month}月团结无纠纷（自动识别）`,
                        value: 1,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }

            // ========== 进步奖 ==========
            if (isMonthOver) {
                const hasDeductionMonth = myMonthLogs.some(l => l.value < 0);
                const hasBonusMonth = myMonthLogs.some(l => l.value > 0);
                if (hasDeductionMonth && hasBonusMonth) {
                    await sb.from('score_log').delete()
                        .eq('student', name)
                        .gte('date', monthStart)
                        .lte('date', monthEndStr)
                        .eq('code', 'U2')
                        .eq('basis', '自动加分');
                    
                    await sb.from('score_log').insert({
                        student: name,
                        date: monthEndStr,
                        week: wk,
                        code: 'U2',
                        reason: `${month}月表现进步（自动识别，班主任可调整）`,
                        value: 2,
                        operator: '系统',
                        basis: '自动加分'
                    });
                    addedCount++;
                }
            }
        }

        await loadData();
        window.renderWeeklySummary();
        
        let msg = `自动识别完成，新增 ${addedCount} 人次奖励。`;
        if (!isWeekOver) msg += '（本周未结束，全勤暂不处理）';
        if (!isMonthOver) msg += '（本月未结束，团结/进步暂不处理）';
        toast(msg);
    } catch (e) {
        console.error(e);
        toast('自动加分出错：' + e.message, 'error');
    } finally {
        window._addingBonusLock = false;
    }
};

    let reason = '________';
    if (reasonSel && reasonSel.selectedOptions.length > 0) {
        const selectedTexts = [];

            if (opt.value && opt.value !== '') {
                selectedTexts.push(opt.getAttribute('data-reason') || opt.text);
            }
        }

    }

    const currentScore = document.getElementById('wn-current').value || '____';
    const level = document.getElementById('wn-level').value || '____';
    const measureRaw = document.getElementById('wn-measure').value || '________';
    const measure = measureRaw.replace(/\n/g, '<br>');

    let phoneDetail = '—';
    let otherViolationsDetail = '—';
    let finalDiscipline = '无';

        const myLogs = logs.filter(l => l.student === student);

        // 1. 累计考勤处分
        let absentPeriods = 0, personalLeave = 0, sickLeave = 0, lateEarlyCount = 0;
        myLogs.forEach(l => {
            const r = l.reason || '';
            if (l.code === 'A1' || l.code === 'A3') {
                const am = parseInt((r.match(/上午(\d+)节/) || [0,0])[1]);
                const pm = parseInt((r.match(/下午(\d+)节/) || [0,0])[1]);
                const eve = parseInt((r.match(/晚自习(\d+)节/) || [0,0])[1]);
                absentPeriods += am + pm + eve;
            } else if (l.code === 'A2' || l.code === 'A4') {
                lateEarlyCount++;
            } else if (l.code === '请假') {
                const isSick = r.startsWith('【病假】');
                const am = parseInt((r.match(/上午(\d+)节/) || [0,0])[1]);
                const pm = parseInt((r.match(/下午(\d+)节/) || [0,0])[1]);
                const eve = parseInt((r.match(/晚自习(\d+)节/) || [0,0])[1]);
                const periods = am + pm + eve;
                if (isSick) sickLeave += periods;
                else personalLeave += periods;
            }
        });
        // 处理没有具体节数的旷课记录：按扣分值推算（旷课1节扣2分）
        myLogs.forEach(l => {
            if ((l.code === 'A1' || l.code === 'A3') && (l.reason || '').indexOf('上午') === -1 && (l.reason || '').indexOf('下午') === -1 && (l.reason || '').indexOf('晚自习') === -1) {
                absentPeriods += Math.abs((l.value || 0) / 2);
            }
        });
        // 迟到/早退2次折算为1节旷课（已在上面统计了lateEarlyCount）
        absentPeriods += Math.floor(lateEarlyCount / 2);
        let attendanceLevel = '无';
        if (absentPeriods >= 90 || personalLeave >= 90) attendanceLevel = '自动退学';
        else if (absentPeriods >= 80 || personalLeave >= 80) attendanceLevel = '留校察看处分';
        else if (absentPeriods >= 50 || personalLeave >= 70) attendanceLevel = '记过处分';
        else if (absentPeriods >= 35 || personalLeave >= 56) attendanceLevel = '严重警告处分';
        else if (absentPeriods >= 21 || personalLeave >= 35) attendanceLevel = '警告处分';
        disciplineDetail = `旷课 ${absentPeriods} 节，事假 ${personalLeave} 节，病假 ${sickLeave} 节 → ${attendanceLevel}`;

        // 2. 手机管理处分
        const phoneCodes = ['M1','M2','C13','C14','C15'];
        const phoneViolations = myLogs.filter(l => phoneCodes.includes(l.code)).length;

        let phoneLevel = '无';
        if (hasResistPhone) {
            phoneLevel = '记过/留校察看/劝退';

    { name: '第六节',   start: [15,20], end: [16,0], period: 6, timeLabel: '下午' },
    { name: '第七节',   start: [16,10], end: [16,50], period: 7, timeLabel: '下午' },
    { name: '晚自习一', start: [19,0], end: [19,50], period: 1, timeLabel: '晚自习' },   // 晚自习内部节次重新编号为1、2
    { name: '晚自习二', start: [20,0], end: [21,0], period: 2, timeLabel: '晚自习' }
];
// 根据当前时间获取当前节次信息
function getCurrentPeriod() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    for (const item of schedule) {
        const [sh, sm] = item.start;
        const [eh, em] = item.end;
        if (h > sh || (h === sh && m >= sm)) {
            if (h < eh || (h === eh && m < em)) {
                return item;
            }
        }
    }
    return null; // 非上课时间
}
// 计算当前节次的实到和缺旷人数
function getCurrentAttendance() {
    const periodInfo = getCurrentPeriod();
    if (!periodInfo || !periodInfo.period) {
        return { label: '非上课时间', present: '-', absent: '-' };
    }

    const today = fmt(new Date());
    const todayLogs = logs.filter(l => l.date === today && l.basis === '缺旷登记');

    // 晚自习只统计住校生，其他时段统计全部在读学生
    let allActive = [];
    if (periodInfo.timeLabel === '晚自习') {
        allActive = students.filter(s => s.status === '在读' && s.zoudu !== '是');
    } else {
        allActive = students.filter(s => s.status === '在读');
    }
    const total = allActive.length;

    const absentSet = new Set();
    for (const l of todayLogs) {
        const student = l.student;
        const code = l.code;
        const reason = l.reason || '';

        // 1. 请假：时段匹配
        if (code === '请假') {
            if (periodInfo.timeLabel === '上午' && reason.includes('上午')) absentSet.add(student);
            else if (periodInfo.timeLabel === '下午' && reason.includes('下午')) absentSet.add(student);
            else if (periodInfo.timeLabel === '晚自习' && reason.includes('晚自习')) absentSet.add(student);
            continue;
        }

        // 2. 旷课（A1/A3）：时段匹配且节次匹配（若没有节次则默认整时段缺勤）
        if (code === 'A1' || code === 'A3') {
            let timeLabel = null;
            if (reason.includes('上午')) timeLabel = '上午';
            else if (reason.includes('下午')) timeLabel = '下午';
            else if (reason.includes('晚自习')) timeLabel = '晚自习';
            if (timeLabel !== periodInfo.timeLabel) continue;

            const periodMatch = reason.match(/第([\d,]+)节/);
            if (periodMatch) {
                const periods = periodMatch[1].split(',').map(Number);
                if (periods.includes(periodInfo.period)) absentSet.add(student);
            } else {
                absentSet.add(student); // 无具体节次，默认该时段缺勤
            }
            continue;
        }

        // 3. 迟到/早退/旷操（A2/A4）：影响所在整个时段（仅限上午/下午）
        if (code === 'A2' || code === 'A4') {
            if (periodInfo.timeLabel === '上午' || periodInfo.timeLabel === '下午') {
                absentSet.add(student);
            }
            continue;
        }

        // 4. 自定义事项（Z1/Z3）：根据时段描述计入缺勤（与仪表盘规则一致）
        if ((code === 'Z1' || code === 'Z3') && 
            (reason.startsWith('特殊事项：') || reason.startsWith('走读/特殊事项：'))) {
            const detail = reason.replace('特殊事项：', '').replace('走读/特殊事项：', '');
            if (periodInfo.timeLabel === '上午' && (detail.includes('早上') || detail.includes('上午'))) {
                absentSet.add(student);
            } else if (periodInfo.timeLabel === '下午' && detail.includes('下午')) {
                absentSet.add(student);
            } else if (periodInfo.timeLabel === '晚自习' && (detail.includes('晚上') || detail.includes('晚自习'))) {
                absentSet.add(student);
            }
        }
    }

    // 晚自习剔除走读生（防止误登记走读生晚自习缺勤）
    if (periodInfo.timeLabel === '晚自习') {
        const zhuxiaoNames = new Set(allActive.map(s => s.name));
        for (const absent of absentSet) {
            if (!zhuxiaoNames.has(absent)) absentSet.delete(absent);
        }
    }

    const present = total - absentSet.size;
    const label = periodInfo.timeLabel === '晚自习' 
        ? periodInfo.name + '（住校）' 
        : periodInfo.name;

    return {
        label: label,
        present: present,
        absent: absentSet.size
    };
}

window.renderDisciplineWarning = function() {
    const activeStudents = students.filter(s => s.status === '在读');
    const result = [];

    activeStudents.forEach(s => {
        const myLogs = logs.filter(l => l.student === s.name);
        let absentPeriods = 0;   // 旷课节数
        let personalLeave = 0;   // 事假节数
        let sickLeave = 0;       // 病假节数
        let lateEarlyCount = 0;  // 迟到/早退次数

        myLogs.forEach(l => {
            const reason = l.reason || '';
            if (l.code === 'A1' || l.code === 'A3') {
                // 旷课：提取节数
                const am = (reason.match(/上午(\d+)节/) || [0,0])[1];
                const pm = (reason.match(/下午(\d+)节/) || [0,0])[1];
                const eve = (reason.match(/晚自习(\d+)节/) || [0,0])[1];
                absentPeriods += parseInt(am) + parseInt(pm) + parseInt(eve);
            } else if (l.code === 'A2' || l.code === 'A4') {
                lateEarlyCount++;
            } else if (l.code === '请假') {
                 // 若没有【事假】或【病假】前缀，旧记录默认视为病假
                const isSick = reason.startsWith('【病假】') || (!reason.startsWith('【事假】') && !reason.startsWith('【病假】'));
                const am = (reason.match(/上午(\d+)节/) || [0,0])[1];
                const pm = (reason.match(/下午(\d+)节/) || [0,0])[1];
                const eve = (reason.match(/晚自习(\d+)节/) || [0,0])[1];
                const periods = parseInt(am) + parseInt(pm) + parseInt(eve);
                if (isSick) {
                    sickLeave += periods;
                } else {
                    personalLeave += periods;
                }
            }
        });

        // 迟到/早退2次折合1节旷课
        absentPeriods += Math.floor(lateEarlyCount / 2);

        // 处分判断（仅针对事假和旷课）
        const disciplineLevels = [
            { maxAbsent: 21, maxLeave: 35, level: '警告处分' },
            { maxAbsent: 35, maxLeave: 56, level: '严重警告处分' },
            { maxAbsent: 50, maxLeave: 70, level: '记过处分' },
            { maxAbsent: 80, maxLeave: 90, level: '留校察看处分' },
            { maxAbsent: 90, maxLeave: 999, level: '自动退学' }
        ];

        let suggestion = '—';
        for (const level of disciplineLevels) {
            if (absentPeriods >= level.maxAbsent || personalLeave >= level.maxLeave) {
                suggestion = level.level;
            }
        }

        result.push({ 
            name: s.name, 
            absent: absentPeriods, 
            personal: personalLeave, 
            sick: sickLeave, 
            suggestion 
        });
    });

    // 渲染表格
    const tbody = document.getElementById('discipline-tbody');
    if (!tbody) return;
    tbody.innerHTML = result.map(r => `
        <tr>
            <td>${r.name}</td>
            <td>${r.absent}</td>
            <td>${r.personal}</td>
            <td>${r.sick}</td>
            <td style="color:${r.suggestion === '—' ? '#10b981' : '#ef4444'}; font-weight:bold;">${r.suggestion}</td>
        </tr>
    `).join('');
};

window.renderPhoneDiscipline = function() {

async function init() {
    if (initLock) return;
    initLock = true;
    try {
        // 检查是否已有登录会话
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
            // 没有会话，显示登录界面
            document.getElementById('login-overlay').style.display = 'flex';
            document.querySelector('.sidebar').style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
            window._uiBuilt = false;
            return;
        }

        // 有会话，隐藏登录界面并加载系统
        document.getElementById('login-overlay').style.display = 'none';
        document.querySelector('.sidebar').style.display = '';
        document.getElementById('mainContent').style.display = '';

        if (!userProfile) {
            try {
                await loadUserProfile(session.user);
            } catch (e) {
                console.error('加载用户资料失败', e);
                userProfile = { role: '班委', phone: '未知' };

    const saved = localStorage.getItem('semester_config');
    if (!saved) { toast('请先设置学期配置', 'error'); return; }

    const start = new Date(cfg.startDate);

      window.saveWeeklyData = async function() {
    const wk = parseInt(document.getElementById('weekly-week-num').value) || getWeek();
    // 读取用户选择的日期，若没选则用今天
    const selectedDate = document.getElementById('weekly-date').value || fmt(new Date());
    const entries = [];
    document.querySelectorAll('#weekly-tbody tr').forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (!inputs.length) return;
        const name = inputs[0].dataset.student;
        const d = { week: wk, student: name };
        inputs.forEach(inp => { d[inp.dataset.day] = inp.value; });
        entries.push(d);
    });
    await sb.from('weekly_data').delete().eq('week', wk);
    if (entries.length) await sb.from('weekly_data').insert(entries);

    const dayNames = { mon:'周一', tue:'周二', wed:'周三', thu:'周四', fri:'周五' };
    const allDeduct = getDeductCodes();
    const allBonus = getBonusCodes();

    for (const e of entries) {
        for (const day of ['mon', 'tue', 'wed', 'thu', 'fri']) {
            const val = e[day]?.trim();
            if (!val) continue;
            const parts = val.split(/\s+/);
            const code = parts[0];
            const score = parseFloat(parts[1]);
            if (!code || isNaN(score)) continue;
            const deductItem = allDeduct.find(c => c.code === code);
            const bonusItem = allBonus.find(c => c.code === code);
            const desc = deductItem?.description || deductItem?.desc || bonusItem?.description || bonusItem?.desc || '';
            const reasonText = desc || code;

            await sb.from('score_log').insert({
                student: e.student,
                date: selectedDate,    // 使用所选日期
                week: wk,
                code: code,
                reason: reasonText,
                value: score,
                operator: userProfile?.role || '班主任',
                basis: '周表'
            });
        }
        if (e.bonus_score && parseFloat(e.bonus_score) !== 0) {
            const bonusCode = e.bonus_reason?.trim() || 'P2';
            const bonusItem = allBonus.find(c => c.code === bonusCode);
            const bonusDesc = bonusItem ? (bonusItem.description || bonusItem.desc) : '加分';
            await sb.from('score_log').insert({
                student: e.student,
                date: selectedDate,    // 使用所选日期
                week: wk,
                code: bonusCode,
                reason: bonusDesc,
                value: Math.abs(parseFloat(e.bonus_score)),
                operator: userProfile?.role || '班主任',
                basis: '周表'
            });
        }
    }
    await loadData();
    renderWeeklyTable();
    window.renderScoreLog();
    refreshDashboard();
    toast('已保存并同步流水');
};

window.editTalk = async function(id) {
    const t = talks.find(t => t.id === id);
    if (!t) { toast('记录未找到', 'error'); return; }

    // 先打开模态框
    if (!document.getElementById('modal-talk')) window.openTalkModal();
    else openModal('modal-talk');

    // 等待下一帧保证元素已渲染
    setTimeout(() => {
        document.getElementById('talk-student').value = t.student;
        document.getElementById('talk-date').value = t.date;
        document.getElementById('talk-type').value = t.type;
        window.loadReasonsForStudent(t.student, 'talk-reason');
        // 延迟勾选原有的违纪事由
        setTimeout(() => {
            const reasonSel = document.getElementById('talk-reason');
            if (reasonSel && t.reason) {
                const reasons = t.reason.split('；');
                for (const opt of reasonSel.options) {
                    const optText = opt.getAttribute('data-reason') || opt.text;
                    if (reasons.some(r => optText.includes(r.trim()))) {
                        opt.selected = true;
                    }
                }
            }
            document.getElementById('talk-points').value = t.points || '';
            document.getElementById('talk-response').value = t.response || '';
            document.getElementById('talk-followup').value = t.followup || '';
        }, 200);
        document.getElementById('talk-edit-id').value = id;
        document.querySelector('#modal-talk h3').textContent = '编辑谈话记录';
    }, 100);
};

window.saveTalk = async function() {
    const student = document.getElementById('talk-student').value;
    const date = document.getElementById('talk-date').value;
    const type = document.getElementById('talk-type').value;
    const points = document.getElementById('talk-points').value.trim();
    const response = document.getElementById('talk-response').value.trim();
    const followup = document.getElementById('talk-followup').value.trim();
    const editId = document.getElementById('talk-edit-id').value;

    const reasonSel = document.getElementById('talk-reason');
    let reason = '';
    if (reasonSel && reasonSel.selectedOptions.length > 0) {
        const texts = [];
        for (const opt of reasonSel.selectedOptions) {
            if (opt.value && opt.value !== '') texts.push(opt.getAttribute('data-reason') || opt.text);
        }
        reason = texts.join('；');
    }

    if (!student) { toast('请选择学生', 'error'); return; }
    if (!reason) { toast('请至少选择一个违纪事由', 'error'); return; }
    if (!date) { toast('请选择日期', 'error'); return; }

    const data = { student, date, type, reason, points, response, followup };
    let error;
    if (editId) {
        ({ error } = await sb.from('talks').update(data).eq('id', parseInt(editId)));
    } else {
        ({ error } = await sb.from('talks').insert(data));
    }

    if (error) {
        toast('保存失败：' + error.message, 'error');
    } else {
        closeModal('modal-talk');
        await loadData();
        renderTalks();
        toast(editId ? '谈话记录已更新' : '谈话记录已保存');
    }
};

window.aiGenerateTalk = async function() {
    const student = document.getElementById('talk-student').value;
    const reasonSel = document.getElementById('talk-reason');
    let reason = '';
    if (reasonSel && reasonSel.selectedOptions.length > 0) {
        const texts = [];
        for (const opt of reasonSel.selectedOptions) {
            if (opt.value) texts.push(opt.getAttribute('data-reason') || opt.text);
        }
        reason = texts.join('；');
    }
    if (!student || !reason) { toast('请先选择学生并填写事由', 'error'); return; }

    const btn = document.querySelector('#modal-talk .btn-outline');
    btn.disabled = true; btn.textContent = '生成中...';

    const systemPrompt = '你是一名经验丰富的中职班主任。请以第一人称“我”的口吻，直接给出针对该生违纪行为的谈话方案。方案必须包含三部分，并用【谈话要点】、【学生可能表态】、【后续跟进】作为每部分的小标题。内容要具体、可操作，避免空泛。不要使用任何 Markdown 格式，纯文本输出。';
    const userPrompt = `学生：${student}，事由：${reason}。请生成谈话方案。`;

    try {
        const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_KEY },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                ],
                temperature: 0.7,
                max_tokens: 600
            })
        });

        if (!res.ok) {
            const errText = await res.text();
            throw new Error(`请求失败 (${res.status}): ${errText}`);
        }

        const json = await res.json();
        if (!json.choices || !json.choices[0] || !json.choices[0].message) {
            throw new Error('AI 返回数据异常');
        }

        let txt = json.choices[0].message.content;
        txt = txt.replace(/#{1,6}\s*/g, '').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1').replace(/^\s*[-*+]\s/gm, '').replace(/^\d+\.\s/gm, '').trim();

        // 按标题分割内容
        const pointsMatch = txt.match(/【(谈话)?要点】\s*([\s\S]*?)(?=【(学生可能)?表态】|【后续跟进】|$)/);
        const responseMatch = txt.match(/【(学生可能)?表态】\s*([\s\S]*?)(?=【后续跟进】|$)/);
        const followupMatch = txt.match(/【后续跟进】\s*([\s\S]*)/);

        if (pointsMatch || responseMatch || followupMatch) {
            document.getElementById('talk-points').value = pointsMatch ? pointsMatch[2].trim() : '';
            document.getElementById('talk-response').value = responseMatch ? responseMatch[2].trim() : '';
            document.getElementById('talk-followup').value = followupMatch ? followupMatch[1].trim() : '';
        } else {
            const parts = txt.split(/\n{2,}/);
            if (parts.length >= 3) {
                document.getElementById('talk-points').value = parts[0].trim();
                document.getElementById('talk-response').value = parts[1].trim();
                document.getElementById('talk-followup').value = parts.slice(2).join('\n\n').trim();
            } else {
                document.getElementById('talk-points').value = txt;
            }
        }
        toast('生成成功');
    } catch (e) {
        console.error(e);
        toast('AI生成失败: ' + e.message, 'error');
    }
    btn.disabled = false; btn.textContent = '👤 处置建议';
};

window.handleRequest = async function(id, newStatus) {
    if (!canModify()) { toast('仅班主任可操作', 'error'); return; }

    // 更新申请状态
    var result = await sb.from('action_requests').update({ status: newStatus }).eq('id', id);
    if (result.error) { toast('操作失败', 'error'); return; }

    toast(newStatus === 'approved' ? '已批准' : '已拒绝');

    // 如果批准，尝试自动执行对应的删除操作
    if (newStatus === 'approved') {
        var { data: request } = await sb.from('action_requests').select('*').eq('id', id).single();
        if (request) {
            try {
                if (request.action === '删除学生') {
                    var idcard = (request.details || '').replace('身份证：', '').trim();
                    if (idcard) {
                        var { error: delError } = await sb.from('students').delete().eq('idcard', idcard);
                        if (delError) {
                            toast('自动删除学生失败: ' + delError.message, 'error');
                        } else {
                            toast('已批准并成功删除学生');
                            await loadData();
                            populateAllSelects();
                            renderRoster();
                            refreshDashboard();
                        }
                    } else {
                        toast('已批准，但无法解析身份证号，请手动删除', 'warning');
                    }
                }
                else if (request.action === '删除操行分记录') {
                    var logId = (request.details || '').replace('记录ID：', '').trim();
                    if (logId) {
                        var { error: delError } = await sb.from('score_log').delete().eq('id', parseInt(logId));
                        if (delError) {
                            toast('自动删除操行分记录失败: ' + delError.message, 'error');
                        } else {
                            toast('已批准并删除操行分记录');
                            await loadData();
                            window.renderScoreLog();
                            refreshDashboard();
                        }
                    } else {
                        toast('已批准，但无法解析记录ID，请手动删除', 'warning');
                    }
                }
                // 后续可扩展其他操作类型
            } catch (e) {
                console.error('自动执行申请失败:', e);
                toast('自动执行出错，请手动处理', 'error');
            }
        }
    }

    // 刷新申请列表和仪表盘通知
    window.loadActionRequests();
    window.renderDashboardNoticeBar();

window.submitAbsence = async function() {
    const wk = parseInt(document.getElementById('absence-week').value) || getWeek();
    const date = document.getElementById('absence-date').value;
    if (!date) { toast('请选择日期', 'error'); return; }

    const checkedStudents = new Set();
    document.querySelectorAll('#absence-tbody input[type="checkbox"][data-student]:checked').forEach(cb => {
        checkedStudents.add(cb.dataset.student);
    });
    if (checkedStudents.size === 0) { toast('请至少勾选一名学生', 'error'); return; }

    let totalRecords = 0;
    const periodLabels = { am: '早上', pm: '下午', eve: '晚上' };

    // 通用节次处理（旷课/迟到/早退/旷操）
    async function processPeriods(student, periods, code, reasonPrefix, pt) {
        if (!periods.length) return;
        const am = periods.filter(p => p >= 1 && p <= 4);
        const pm = periods.filter(p => p >= 5 && p <= 6);
        const eve = periods.filter(p => p >= 7 && p <= 8);
        const points = (code === 'A1' ? -2 : pt);
        if (am.length) {
            await sb.from('score_log').insert({ student, date, week: wk, code, reason: `${reasonPrefix}上午${am.length}节（第${am.join(',')}节）`, value: am.length * points, operator: getOperatorName(), basis: '缺旷登记' });
            totalRecords++;
        }
        if (pm.length) {
            await sb.from('score_log').insert({ student, date, week: wk, code, reason: `${reasonPrefix}下午${pm.length}节（第${pm.join(',')}节）`, value: pm.length * points, operator: getOperatorName(), basis: '缺旷登记' });
            totalRecords++;
        }
        if (eve.length) {
    const eveCode = (code === 'A1' ? 'A3' : code);
    // 晚自习固定5分（两节共5分），而不是每节5分
    const evePoints = (code === 'A1' ? -5 : pt);
    // 只扣一次分，不是每节都扣
    await sb.from('score_log').insert({ 
        student, date, week: wk, code: eveCode, 
        reason: `${reasonPrefix}晚自习（第${eve.join(',')}节）`, 
        value: evePoints, 
        operator: getOperatorName(), basis: '缺旷登记' 
    });
    totalRecords++;
}
    }

    const allRows = document.querySelectorAll('#absence-tbody tr');
    for (const row of allRows) {
        const checkbox = row.querySelector('input[type="checkbox"][data-student]');
        if (!checkbox || !checkbox.checked) continue;
        const student = checkbox.dataset.student;

        // 旷课
        const truancySelect = row.querySelector('select[data-type="TRUANCY"]');
        if (truancySelect) {
            const selected = Array.from(truancySelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A1', '旷课：', -2);
        }
        // 迟到
        const lateSelect = row.querySelector('select[data-type="LATE"]');
        if (lateSelect) {
            const selected = Array.from(lateSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A2', '迟到：', -0.5);
        }
        // 早退
        const earlySelect = row.querySelector('select[data-type="LEAVE_EARLY"]');
        if (earlySelect) {
            const selected = Array.from(earlySelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A2', '早退：', -0.5);
        }
        // 旷操
        const noExerciseSelect = row.querySelector('select[data-type="NO_EXERCISE"]');
        if (noExerciseSelect) {
            const selected = Array.from(noExerciseSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) await processPeriods(student, selected, 'A4', '旷操：', -1);
        }

        // ========== 请假处理（支持节次合并 + 连续累计扣分） ==========
        const leaveSelect = row.querySelector('select[data-type="LEAVE_PERIOD"]');
        if (leaveSelect) {
            const selected = Array.from(leaveSelect.selectedOptions).map(o => parseInt(o.value));
            if (selected.length) {
                // 当前选择的节次统计
                const curAm = selected.filter(p => p >= 1 && p <= 4).length;
                const curPm = selected.filter(p => p >= 5 && p <= 6).length;
                const curEve = selected.filter(p => p >= 7 && p <= 8).length;

                // 查询当天是否已有请假记录
                const { data: existing } = await sb.from('score_log')
                    .select('*')
                    .eq('student', student)
                    .eq('date', date)
                    .eq('code', '请假')
                    .maybeSingle();

                let mergedAm = curAm, mergedPm = curPm, mergedEve = curEve;
                if (existing) {
                    // 解析旧记录中的节次（格式：上午X节，下午Y节，晚自习Z节）
                    const oldReason = existing.reason || '';
                    const parsePeriod = (text, keyword) => {
                        const regex = new RegExp(`${keyword}(\\d+)节`);
                        const match = text.match(regex);
                        return match ? parseInt(match[1]) : 0;
                    };
                    mergedAm += parsePeriod(oldReason, '上午');
                    mergedPm += parsePeriod(oldReason, '下午');
                    mergedEve += parsePeriod(oldReason, '晚自习');
                }

                               // 合并节次列表（保留具体节次编号）
                const curAmPeriods = selected.filter(p => p >= 1 && p <= 4).sort((a,b)=>a-b);
                const curPmPeriods = selected.filter(p => p >= 5 && p <= 6).sort((a,b)=>a-b);
                const curEvePeriods = selected.filter(p => p >= 7 && p <= 8).sort((a,b)=>a-b);
                
                let mergedAmPeriods = [...curAmPeriods];
                let mergedPmPeriods = [...curPmPeriods];
                let mergedEvePeriods = [...curEvePeriods];
                
                if (existing) {
                    // 合并旧记录的节次（如果旧记录中有具体节次信息）
                    const oldReason = existing.reason || '';
                    const parsePeriods = (text, keyword) => {
                        const regex = new RegExp(`${keyword}(\\d+)节（第([\\d,]+)节）`);
                        const match = text.match(regex);
                        if (match) return match[2].split(',').map(Number);
                        return [];
                    };
                    const oldAm = parsePeriods(oldReason, '上午');
                    const oldPm = parsePeriods(oldReason, '下午');
                    const oldEve = parsePeriods(oldReason, '晚自习');
                    // 如果旧记录没有具体节次，则使用数量推算（保留当前合并逻辑的数量）
                    if (oldAm.length === 0 && mergedAm > curAmPeriods.length) {
                        // 无法获取旧节次，只能按数量保留
                    } else {
                        mergedAmPeriods = [...new Set([...oldAm, ...curAmPeriods])].sort((a,b)=>a-b);
                    }
                    if (oldPm.length === 0 && mergedPm > curPmPeriods.length) {
                    } else {
                        mergedPmPeriods = [...new Set([...oldPm, ...curPmPeriods])].sort((a,b)=>a-b);
                    }
                    if (oldEve.length === 0 && mergedEve > curEvePeriods.length) {
                    } else {
                        mergedEvePeriods = [...new Set([...oldEve, ...curEvePeriods])].sort((a,b)=>a-b);
                    }
                    // 重新计算合并后的节数
                    mergedAm = mergedAmPeriods.length;
                    mergedPm = mergedPmPeriods.length;
                    mergedEve = mergedEvePeriods.length;
                }

                // 计算合并后的总天数
                let totalDays = (mergedAm > 0 ? 0.5 : 0) + (mergedPm > 0 ? 0.5 : 0) + (mergedEve > 0 ? 0.5 : 0);

                const amStr = mergedAm > 0 ? `上午${mergedAm}节（第${mergedAmPeriods.join(',')}节）` : '';
                const pmStr = mergedPm > 0 ? `下午${mergedPm}节（第${mergedPmPeriods.join(',')}节）` : '';
                const eveStr = mergedEve > 0 ? `晚自习${mergedEve}节（第${mergedEvePeriods.join(',')}节）` : '';
                const desc = [amStr, pmStr, eveStr].filter(Boolean).join('，');

                // 连续请假天数计算（扣除当天后查询历史，再累加）
                let oldConsecutiveDays = 0;
                const dateObj = new Date(date);
                const yesterday = new Date(dateObj);
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = fmt(yesterday);

                // 查询该生所有历史请假记录（不包括当天，因为即将更新）
                const { data: leaveHistory } = await sb.from('score_log')
                    .select('date, reason')
                    .eq('student', student)
                    .eq('code', '请假')
                    .neq('date', date)   // 排除当天
                    .order('date', { ascending: true });

                const parseDays = (reason) => {
                    const match = reason.match(/合计([\d.]+)天/);
                    return match ? parseFloat(match[1]) : 0;
                };

                const dailyMap = new Map();
                if (leaveHistory) {
                    leaveHistory.forEach(r => {
                        const day = r.date;
                        const days = parseDays(r.reason || '');
                        dailyMap.set(day, (dailyMap.get(day) || 0) + days);
                    });
                }

                if (dailyMap.has(yesterdayStr)) {
                    let checkDate = new Date(yesterday);
                    while (dailyMap.has(fmt(checkDate))) {
                        oldConsecutiveDays += dailyMap.get(fmt(checkDate));
                        checkDate.setDate(checkDate.getDate() - 1);
                    }
                }

                const newTotalDays = oldConsecutiveDays + totalDays;
                const oldOver = Math.max(0, oldConsecutiveDays - 1);
                const newOver = Math.max(0, newTotalDays - 1);
                const value = -(newOver - oldOver);

                                // 获取请假类型
                const leaveTypeSelect = row.querySelector('select[data-type="LEAVE_TYPE"]');
                const leaveType = leaveTypeSelect ? leaveTypeSelect.value : '事假';
                const leaveTypePrefix = leaveType === '病假' ? '【病假】' : '【事假】';
                
                let reason = `${leaveTypePrefix}请假：${desc}，合计${totalDays}天`;
                if (newTotalDays > 1) {
                    reason += `（连续累计${newTotalDays}天，超期${newOver.toFixed(1)}天，本次扣${Math.abs(value)}分）`;
                }

                // 删除当天旧记录（实现合并更新）
                if (existing) {
                    await sb.from('score_log').delete().eq('id', existing.id);
                }

                await sb.from('score_log').insert({
                    student, date, week: wk, code: '请假',
                    reason, value, operator: getOperatorName(), basis: '缺旷登记'
                });
                totalRecords++;
            }
        }

        // 自定义事项（多个时段合并为一条记录，代码Z3）
        const customPeriodSelect = row.querySelector('select[data-type="CUSTOM_PERIOD"]');
        const customDescInput = row.querySelector('input[data-type="CUSTOM_DESC"]');
        if (customPeriodSelect && customDescInput) {
            const selectedPeriods = Array.from(customPeriodSelect.selectedOptions).map(o => o.value);
            const descText = customDescInput.value.trim();
            if (selectedPeriods.length && descText) {
                const allLabels = selectedPeriods.map(p => periodLabels[p] || p).join('、');
                const mergedReason = `走读/特殊事项：${allLabels} ${descText}`;
                await sb.from('score_log').insert({
                    student, date, week: wk, code: 'Z3',
                    reason: mergedReason,
                    value: 0, operator: getOperatorName(), basis: '缺旷登记'
                });
                totalRecords++;
            }
        }
    }

    if (totalRecords === 0) { toast('没有检测到有效登记数据', 'error'); return; }
    await loadData(); renderAbsenceTable(); refreshDashboard(); window.renderScoreLog();
    toast(`已提交 ${totalRecords} 条记录`);
};

        buildUI();
        window.loadSemesterConfig();
        await loadData();
        // 如果预设数据，则不作处理
        if (students.length === 0) {

window.refreshComprehensiveScores = async function() {
    // 1. 从数据库获取所有在读学生及其操行分（通过 score_log 实时计算）和综合分
    const active = students.filter(s => s.status === '在读');
    const tbody = document.getElementById('comprehensive-tbody');
    if (active.length === 0) { tbody.innerHTML = '<tr><td colspan="4">暂无学生</td></tr>'; return; }
    
    // 计算每个学生的操行分
    const conductScores = {};
    for (const s of active) {
        conductScores[s.name] = calcScore(s.name);
    }
    // 获取每个学生的平均成绩（所有科目）
    const avgScores = {};
    for (const s of active) {
        const { data, error } = await sb.from('student_semester_scores')
            .select('score')
            .eq('student_id', s.id)
            .eq('exam_type', '期末考试');
        if (error) continue;
        if (data && data.length > 0) {
            const avg = data.reduce((sum, r) => sum + r.score, 0) / data.length;
            avgScores[s.name] = avg;
        } else {
            avgScores[s.name] = 0;
        }
    }
    // 构建表格并计算综合分（操行分*0.6 + 平均成绩*0.4）
    let html = '';
    for (const s of active) {
        const conduct = conductScores[s.name] || 100;
        const avg = avgScores[s.name] || 0;
        const comprehensive = conduct * 0.6 + avg * 0.4;
        // 更新数据库中的 comprehensive_score 字段
        await sb.from('students').update({ comprehensive_score: comprehensive }).eq('id', s.id);
        html += `<tr>
            <td>${s.name}</td>
            <td>${conduct}</td>
            <td>${avg.toFixed(1)}</td>
            <td style="font-weight:bold;">${comprehensive.toFixed(1)}</td>
        </tr>`;
    }
    tbody.innerHTML = html;
    toast('综合分已同步更新到数据库');
};

window.importGradeExcel = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx, .xls, .csv';
    input.onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (!rows || rows.length < 2) {
            toast('Excel 至少需要两行（表头+数据）', 'error');
            return;
        }
        const headers = rows[0].map(cell => String(cell).trim());
        let nameIdx = -1, subjectIdx = -1, scoreIdx = -1, semesterIdx = -1;
        for (let i = 0; i < headers.length; i++) {
            const h = headers[i].toLowerCase();
            if (h.includes('姓名') || h === 'name') nameIdx = i;
            if (h.includes('科目') || h === 'subject') subjectIdx = i;
            if (h.includes('成绩') || h === 'score' || h === '分数') scoreIdx = i;
            if (h.includes('学期') || h === 'semester') semesterIdx = i;
        }
        if (nameIdx === -1 || subjectIdx === -1 || scoreIdx === -1) {
            toast('Excel 必须包含“学生姓名”、“科目”、“成绩”三列', 'error');
            return;
        }
        const defaultSemester = document.getElementById('grade-semester')?.value || '2025-2026学年第一学期';
        const activeStudents = students.filter(s => s.status === '在读');
        const studentMap = new Map();
        activeStudents.forEach(s => studentMap.set(s.name, s.id));
        
        const insertData = [];
        const missingStudents = new Set();
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;
            const name = String(row[nameIdx] || '').trim();
            if (!name) continue;
            const subject = String(row[subjectIdx] || '').trim();
            if (!subject) continue;
            const score = parseFloat(row[scoreIdx]);
            if (isNaN(score)) continue;
            const semester = semesterIdx !== -1 ? String(row[semesterIdx] || '').trim() : defaultSemester;
            if (!semester) continue;
            const studentId = studentMap.get(name);
            if (!studentId) {
                missingStudents.add(name);
                continue;
            }
            insertData.push({
                student_id: studentId,
                semester: semester,
                subject: subject,
                exam_type: '期末考试',
                score: score
            });
        }
        if (insertData.length === 0) {
            toast('没有有效的成绩数据可导入', 'error');
            if (missingStudents.size > 0) {
                console.warn('未匹配的学生:', Array.from(missingStudents));
                toast(`未找到学生: ${Array.from(missingStudents).join(', ')}`, 'error');
            }
            return;
        }
        let successCount = 0;
        for (const item of insertData) {
            const { error } = await sb.from('student_semester_scores').upsert(item, {
                onConflict: 'student_id, semester, subject, exam_type'
            });
            if (!error) successCount++;
        }
        toast(`成功导入 ${successCount} 条成绩记录`, 'success');
        await window.loadGradeTable();
        await window.refreshComprehensiveScores();
    };
    input.click();
};

window.settingsNav = function(page) {
    const main = document.getElementById('settings-main');
    const sub = document.getElementById('settings-subpage');
    if (!main || !sub) return;

    if (page === 'main') {
        main.style.display = '';
        sub.style.display = 'none';
        // 刷新个人信息
        if (userProfile) {
            document.getElementById('settings-profile-name').textContent = userProfile.name || '管理员';
            document.getElementById('settings-profile-role').textContent = userProfile.role || '班主任';
            document.getElementById('settings-avatar').textContent = (userProfile.name || '管')[0];
        }
        return;
    }

    main.style.display = 'none';
    sub.style.display = 'block';

    let html = `<div class="settings-back-btn" onclick="settingsNav('main')">← 返回</div>`;
    switch(page) {
        case 'account': html += settingsAccountHTML(); break;
        case 'display': html += settingsDisplayHTML(); break;
        case 'data': html += settingsDataHTML(); break;
        case 'class': html += settingsClassHTML(); break;
        case 'security': html += settingsSecurityHTML(); break;
        case 'system': html += settingsSystemHTML(); break;
        case 'family': html += settingsFamilyHTML(); break;
    }
    sub.innerHTML = html;
    // 加载子页面特定数据
    if (page === 'data') updateBackupInfo();
    if (page === 'display') loadDisplaySettings();
};

window.toggleAutoBackup = function() {
    const sw = document.getElementById('auto-backup-switch');
    if (sw.checked) {
        localStorage.setItem('auto_backup', '1');
        startAutoBackup();
    } else {
        localStorage.removeItem('auto_backup');
        if (window._autoBackupInterval) clearInterval(window._autoBackupInterval);
    }
};
function startAutoBackup() {
    if (window._autoBackupInterval) clearInterval(window._autoBackupInterval);
    window._autoBackupInterval = setInterval(() => {
        performBackup('自动备份');
    }, 24 * 60 * 60 * 1000); // 每天
}
window.manualBackup = function() { performBackup('手动备份'); };
function performBackup(label) {
    const backup = {
        students, logs, classLogs, dailyLogs, alerts, talks, weeklyData, deductCodes, bonusCodes,
        time: new Date().toISOString(), label
    };
    const backups = JSON.parse(localStorage.getItem('data_backups') || '[]');
    backups.unshift(backup);
    if (backups.length > 10) backups.pop();
    localStorage.setItem('data_backups', JSON.stringify(backups));
    localStorage.setItem('last_backup_time', new Date().toLocaleString());
    updateBackupInfo();
    toast(label + '完成');
}
function updateBackupInfo() {
    const lastTime = localStorage.getItem('last_backup_time');
    const el = document.getElementById('last-backup-time');
    if (el) el.textContent = lastTime ? `上次：${lastTime}` : '';
    const sw = document.getElementById('auto-backup-switch');
    if (sw) sw.checked = localStorage.getItem('auto_backup') === '1';
}

    const backups = JSON.parse(localStorage.getItem('data_backups') || '[]');
    if (!backups.length) { toast('没有备份记录','error'); return; }

    backups.forEach((b,i) => { html += `<li style="cursor:pointer;padding:8px;" onclick="doRestore(${i})">${b.label} - ${new Date(b.time).toLocaleString()}</li>`; });
    html += '</ul>';

    modal.className = 'modal active'; modal.id = 'modal-restore';
    modal.innerHTML = `<div class="modal-content">${html}<button class="btn-outline" onclick="closeModal('modal-restore')">取消</button></div>`;
    document.body.appendChild(modal);
};

// 实际导出函数
window.startPDFExport = async function(period) {
    const modal = document.getElementById('modal-pdf-export');
    if (modal) modal.remove();
    toast('正在生成 PDF，请稍候...');
    
    const now = new Date();
    let startDate, endDate = now;
    
    if (period === '本周') {
        const d = new Date(now);
        d.setDate(d.getDate() - d.getDay());
        d.setHours(0,0,0,0);
        startDate = d;
    } else if (period === '本月') {
        startDate = new Date(now.getFullYear(), now.getMonth(), 1);
    } else if (period === '本学期') {
        const saved = localStorage.getItem('semester_config');
        if (saved) {
            startDate = new Date(JSON.parse(saved).startDate);
        } else {
            startDate = new Date(now.getFullYear(), now.getMonth() - 3, 1);
        }
    } else if (period === 'custom') {
        const startEl = document.getElementById('pdf-start-date');
        const endEl = document.getElementById('pdf-end-date');
        if (startEl && endEl && startEl.value && endEl.value) {
            startDate = new Date(startEl.value);
            endDate = new Date(endEl.value);
        } else {
            toast('请选择日期范围', 'error');
            return;
        }
    } else {
        startDate = new Date(0);
    }
    
    const startStr = startDate.toISOString().split('T')[0];
    const endStr = endDate.toISOString().split('T')[0];
    
    const filteredLogs = logs.filter(l => l.date >= startStr && l.date <= endStr);
    const filteredClass = classLogs.filter(l => l.date >= startStr && l.date <= endStr);
    const filteredDaily = dailyLogs.filter(l => l.date >= startStr && l.date <= endStr);
    
    const activeStudents = students.filter(s => s.status === '在读');
    const totalScore = activeStudents.reduce((sum, s) => sum + calcScore(s.name), 0);
    const avgScore = activeStudents.length > 0 ? (totalScore / activeStudents.length).toFixed(1) : 0;
    const warningCount = activeStudents.filter(s => calcScore(s.name) < 70).length;
    const excellentCount = activeStudents.filter(s => calcScore(s.name) >= 90).length;
    
    const violationCount = {};
    filteredLogs.filter(l => l.value < 0).forEach(l => {
        const key = l.code || '未知';
        violationCount[key] = (violationCount[key] || 0) + 1;
    });
    const topViolations = Object.entries(violationCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([code, count]) => `${code}(${count}次)`)
        .join('、');
    
    let aiReport = '';
    try {
        const prompt = `请生成一份简短的班级数据报告（200字内）：班级共${activeStudents.length}人，操行平均分${avgScore}，优秀${excellentCount}人，预警${warningCount}人。数据周期为${startStr}至${endStr}。主要违纪类型：${topViolations || '无'}。请概述整体表现并给出建议。`;
        aiReport = await callAI('你是班主任助手，直接输出报告内容，不用Markdown。', prompt, 500);
    } catch(e) { 
        aiReport = 'AI报告生成失败，请稍后重试。';
    }
    
    const periodLabel = period === 'custom' ? `${startStr} 至 ${endStr}` : period;
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    printWindow.document.write(`<html><head><title>班级综合数据报告</title>
        <style>
            body { font-family: SimSun, '宋体', serif; font-size: 14px; line-height: 1.8; padding: 20px; color: #333; }
            h1 { text-align: center; font-size: 22px; margin-bottom: 5px; }
            h2 { font-size: 18px; border-bottom: 2px solid #1a73e8; padding-bottom: 5px; margin-top: 20px; }
            h3 { font-size: 16px; margin-top: 15px; }
            table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
            th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
            th { background: #f0f5ff; font-weight: bold; }
            .report-header { text-align: center; margin-bottom: 15px; }
            .report-header p { margin: 3px 0; color: #666; }
            .ai-report { background: #f8fafc; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #1a73e8; }
            .highlight { color: #ef4444; font-weight: bold; }
            @media print { body { -webkit-print-color-adjust: exact; } }
            @page { size: A4; margin: 15mm; }
        </style></head><body>
        <div class="report-header">
            <h1>25级化学工艺1班 综合数据报告</h1>
            <p>数据周期：${periodLabel}</p>
            <p>生成日期：${new Date().toLocaleDateString()} | 班主任：${userProfile?.name || '—'}</p>
        </div>
        <h2>📊 AI 分析报告</h2>
        <div class="ai-report">${aiReport.replace(/\n/g, '<br>')}</div>
        <h2>📈 班级操行概况</h2>
        <table>
            <tr><th>总人数</th><th>操行平均分</th><th>优秀人数</th><th>预警人数</th><th>违纪高发类型</th></tr>
            <tr><td>${activeStudents.length}</td><td>${avgScore}</td><td>${excellentCount}</td><td class="highlight">${warningCount}</td><td>${topViolations || '无'}</td></tr>
        </table>
        <h2>👥 学生操行总表</h2>
        <table>
            <tr><th>姓名</th><th>操行分</th><th>等级</th><th>近期变动</th></tr>
            ${activeStudents.map(s => `<tr><td>${s.name}</td><td>${calcScore(s.name)}</td><td>${level(calcScore(s.name))}</td><td>${filteredLogs.filter(l=>l.student===s.name).slice(0,3).map(l=>l.date+' '+l.code).join(', ')||'—'}</td></tr>`).join('')}
        </table>
        <h2>📝 操行记录明细 (${filteredLogs.length}条)</h2>
        <table>
            <tr><th>日期</th><th>学生</th><th>代码</th><th>事由</th><th>分值</th></tr>
            ${filteredLogs.slice(0,200).map(l=>`<tr><td>${l.date}</td><td>${l.student}</td><td>${l.code}</td><td>${l.reason||''}</td><td style="color:${l.value<0?'#ef4444':'#10b981'}">${l.value>0?'+':''}${l.value}</td></tr>`).join('')}
        </table>
        <h2>📖 课堂日志 (${filteredClass.length}条)</h2>
        <table>
            <tr><th>日期</th><th>节次</th><th>科目</th><th>评级</th><th>违纪记录</th></tr>
            ${filteredClass.slice(0,100).map(l=>`<tr><td>${l.date}</td><td>${l.period}</td><td>${l.subject||''}</td><td>${l.rating}</td><td>${l.violation||'—'}</td></tr>`).join('')}
        </table>
        <div style="text-align:center;margin-top:30px;font-size:12px;color:#999;"><p>— 报告由班级管理系统自动生成 —</p></div>
        </body></html>`);
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => { printWindow.print(); printWindow.close(); }, 800);
};
window.cleanData = function() {
    if (!confirm('确定要清理三个月前的操行记录和日志吗？此操作不可恢复！')) return;
    const threeMonthsAgo = new Date();
    threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
    logs = logs.filter(l => new Date(l.date) >= threeMonthsAgo);
    classLogs = classLogs.filter(l => new Date(l.date) >= threeMonthsAgo);
    dailyLogs = dailyLogs.filter(l => new Date(l.date) >= threeMonthsAgo);
    // 同步到Supabase
    saveAllDataToSupabase();
    toast('清理完成');
};

// ========== 班级管理 ==========
window.openScheduleManager = function() {
    let sch = JSON.parse(localStorage.getItem('class_schedule') || '[]');
    let html = '<h3>编辑课表</h3><table><tr><th>节次</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr>';
    for(let i=1;i<=7;i++) {
        html += `<tr><td>第${i}节</td>`;
        for(let d=0;d<5;d++) {
            html += `<td><input value="${sch[i]?.[d]||''}" data-period="${i}" data-day="${d}"></td>`;
        }
        html += '</tr>';
    }
    html += '</table><button onclick="saveSchedule()">保存课表</button>';
    const modal = document.createElement('div');
    modal.className = 'modal active'; modal.id = 'modal-schedule';
    modal.innerHTML = `<div class="modal-content" style="max-width:700px;">${html}<button class="btn-outline" onclick="closeModal('modal-schedule')">关闭</button></div>`;
    document.body.appendChild(modal);
};
window.saveSchedule = function() {
    const sch = {};
    document.querySelectorAll('#modal-schedule input').forEach(inp => {
        const p = inp.dataset.period, d = inp.dataset.day;
        if (!sch[p]) sch[p] = {};
        sch[p][d] = inp.value;
    });
    localStorage.setItem('class_schedule', JSON.stringify(sch));
    toast('课表已保存');
};

window.openAnnouncement = function() {

// 在 refreshPage 中调用
const originalRefreshSettings = window.refreshPage;
window.refreshPage = function(p) {
    originalRefreshSettings(p);
    if (p === 'settings') {
    const savedTheme = localStorage.getItem('theme') || 'default';
    const themeSelect = document.getElementById('theme-select');
    if (themeSelect) { themeSelect.value = savedTheme; window.changeTheme(); }
    const savedBrightness = localStorage.getItem('brightness') || '100';
    const brightnessRange = document.getElementById('brightness-range');
    if (brightnessRange) { brightnessRange.value = savedBrightness; window.changeBrightness(savedBrightness); }
    // 安全处理 card-account-admin，仅当元素存在时操作
    const cardAdmin = document.getElementById('card-account-admin');
    if (canModify()) {
        if (cardAdmin) cardAdmin.style.display = '';
        window.loadAccounts();
    } else {
        if (cardAdmin) cardAdmin.style.display = 'none';
    }
}
};
window.settingsNavToAccounts = function() {
    const modal = document.createElement('div');
    modal.className = 'modal active'; modal.id = 'modal-accounts';
    modal.innerHTML = `<div class="modal-content" style="max-width:700px;"><h3>账号管理</h3>
        <div id="modal-account-list">加载中...</div>
        <button class="btn-outline" onclick="closeModal('modal-accounts')">关闭</button></div>`;
    document.body.appendChild(modal);
    window.loadAccountsIntoModal();
};
window.loadAccountsIntoModal = async function() {
    if (!canModify()) return;
    const container = document.getElementById('modal-account-list');
    if (!container) return;
    try {
        const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
        if (error) { container.innerHTML = '加载失败'; return; }
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="text-align:center;">暂无账号</p>';
            return;
        }
        let html = '<table style="width:100%; text-align:center; border-collapse:collapse;">';
        html += '<tr><th>账号</th><th>姓名</th><th>职务</th><th>系统角色</th><th>状态</th><th>操作</th></tr>';
        for (let i = 0; i < data.length; i++) {
            const p = data[i];
            const statusText = p.status === 'active' ? '启用' : '禁用';
            const displayName = p.name || '—';
            const displayClassRole = p.class_role || '—';
            html += '<tr>' +
                '<td>' + (p.username || p.phone || '—') + '</td>' +
                '<td>' + displayName + '</td>' +
                '<td>' + displayClassRole + '</td>' +
                '<td>' + (p.role || '—') + '</td>' +
                '<td>' + statusText + '</td>' +
                '<td>' +
                '<button class="btn-sm" onclick="window.editAccount(\'' + p.user_id + '\', \'' + (p.name || '') + '\', \'' + (p.class_role || '') + '\', \'' + (p.role || '') + '\')">✏️ 编辑</button> ' +
                '<button class="btn-sm" onclick="window.toggleAccountStatus(\'' + p.user_id + '\', \'' + p.status + '\')">' + (p.status === 'active' ? '禁用' : '启用') + '</button> ' +
                '<button class="btn-sm" onclick="window.resetUserPassword(\'' + p.user_id + '\')">🔑 重置密码</button> ' +
                '<button class="btn-sm btn-danger" onclick="window.deleteAccount(\'' + p.user_id + '\')">🗑 删除</button>' +
                '</td>' +
                '</tr>';
        }
        html += '</table>';
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<p style="text-align:center; color:red;">加载出错</p>';
    }
};
window.quickExportExcel = function() {
    const choice = prompt('请选择导出类型：\n1 - 学生名册\n2 - 操行记录\n3 - 课堂日志\n4 - 班级日志', '1');
    if (!choice) return;
    let data, filename;
    switch(choice) {
        case '1': data = students; filename = '学生名册.xlsx'; break;
        case '2': data = logs; filename = '操行记录.xlsx'; break;
        case '3': data = classLogs; filename = '课堂日志.xlsx'; break;
        case '4': data = dailyLogs; filename = '班级日志.xlsx'; break;
        default: toast('无效选择','error'); return;
    }
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, filename);
    toast('导出成功');
};
